<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotV3 - Dashboard สรุปข้อมูลยื่น</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0e1117;
            color: #fafafa;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 10px;
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .nav-bar {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        
        .nav-link {
            padding: 10px 20px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .nav-link:hover {
            background: #475569;
        }
        
        .nav-link.active {
            background: #667eea;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 10px;
            border-left: 4px solid;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .stat-card.blue { border-left-color: #60a5fa; }
        .stat-card.green { border-left-color: #10b981; }
        .stat-card.yellow { border-left-color: #fbbf24; }
        .stat-card.purple { border-left-color: #a78bfa; }
        
        .stat-card-title {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .stat-card-value {
            color: #fafafa;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .stat-card-subtitle {
            color: #64748b;
            font-size: 0.85em;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 10px;
        }
        
        .chart-card h3 {
            color: #fbbf24;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
        }
        
        .table-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .table-card h3 {
            color: #fbbf24;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        
        .dashboard-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .dashboard-table th,
        .dashboard-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        
        .dashboard-table th {
            background: #0f172a;
            color: #60a5fa;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        .dashboard-table td {
            color: #cbd5e1;
        }
        
        .dashboard-table tr:hover {
            background: #0f172a;
        }
        
        .dashboard-table tr.clickable {
            cursor: pointer;
        }
        
        .dashboard-table tr.clickable:hover {
            background: #0f172a;
            border-left: 3px solid #667eea;
        }
        
        .build-details {
            display: none;
            background: #0f172a;
            padding: 20px;
            border-left: 4px solid #667eea;
        }
        
        .build-details.expanded {
            display: block;
        }
        
        .company-item {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #10b981;
        }
        
        .company-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .company-item-name {
            color: #60a5fa;
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .company-item-stats {
            display: flex;
            gap: 20px;
        }
        
        .company-item-stat {
            text-align: center;
        }
        
        .company-item-stat-label {
            color: #94a3b8;
            font-size: 0.85em;
        }
        
        .company-item-stat-value {
            color: #10b981;
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .company-files-list {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }
        
        .company-files-title {
            color: #94a3b8;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        
        .company-files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            background: #0f172a;
            padding: 10px;
            border-radius: 5px;
        }
        
        .file-item {
            color: #cbd5e1;
            font-size: 0.85em;
            padding: 5px;
            background: #1e293b;
            border-radius: 3px;
        }
        
        .amount-cell {
            text-align: right;
            font-weight: 600;
            color: #10b981;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        
        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        #companyDropdown {
            transition: all 0.3s;
        }
        
        #companyDropdown:hover {
            border-color: #667eea;
        }
        
        #companyDropdown:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard สรุปข้อมูลยื่น บอจ.5/งบการเงิน/ภ.ง.ด.50</h1>
            <p>ภาพรวมข้อมูลสรุปการยื่นแบบภาษีและเอกสารที่เกี่ยวข้อง</p>
        </div>
        
        <div class="nav-bar">
            <a href="/" class="nav-link">🏠 หน้าแรก</a>
            <a href="/email" class="nav-link">📧 ส่งอีเมลล์</a>
            <a href="/filing-summary" class="nav-link">📋 สรุปข้อมูลยื่น</a>
            <a href="/filing-dashboard" class="nav-link active">📊 Dashboard</a>
            <button class="nav-link" onclick="exportToExcel()" style="background: #10b981; border: none; cursor: pointer;">
                📥 ส่งออก Excel
            </button>
        </div>
        
        <div id="dashboardContent">
            <div class="loading">
                <p>⏳ กำลังโหลดข้อมูล...</p>
            </div>
        </div>
    </div>
    
    <script>
        let allSummaryData = [];
        let charts = {};
        
        // โหลดข้อมูลเมื่อหน้าเว็บโหลดเสร็จ
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardData();
        });
        
        // ฟังก์ชันโหลดข้อมูล Dashboard
        async function loadDashboardData() {
            try {
                const response = await fetch('/api/filing-summary/data');
                const data = await response.json();
                
                if (!data.success) {
                    if (response.status === 403) {
                        window.location.href = '/filing-summary';
                        return;
                    }
                    throw new Error(data.message || 'ไม่สามารถโหลดข้อมูลได้');
                }
                
                // รองรับทั้งรูปแบบเก่าและใหม่
                let ocrCacheData = [];
                let auditcheckData = [];
                
                if (data.summary_data && typeof data.summary_data === 'object' && !Array.isArray(data.summary_data)) {
                    // รูปแบบใหม่: แยก ocr_cache และ auditcheck
                    ocrCacheData = data.summary_data.ocr_cache || [];
                    auditcheckData = data.summary_data.auditcheck || [];
                    allSummaryData = [...ocrCacheData, ...auditcheckData];
                } else {
                    // รูปแบบเก่า (backward compatibility)
                    const oldData = data.summary_data || [];
                    ocrCacheData = oldData.filter(item => item.data_source === 'ocr_cache' || !item.data_source);
                    auditcheckData = oldData.filter(item => item.data_source === 'auditcheck');
                    allSummaryData = oldData;
                }
                
                displayDashboard(allSummaryData, ocrCacheData, auditcheckData);
            } catch (error) {
                console.error('Error loading dashboard data:', error);
                document.getElementById('dashboardContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <h2>เกิดข้อผิดพลาด</h2>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
        
        // ฟังก์ชันแสดง Dashboard
        function displayDashboard(data, ocrCacheData, auditcheckData) {
            const container = document.getElementById('dashboardContent');
            
            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h2>ยังไม่มีข้อมูล</h2>
                        <p>ยังไม่มีข้อมูลสรุปการยื่นแบบภาษี</p>
                    </div>
                `;
                return;
            }
            
            // คำนวณสถิติรวม
            const stats = calculateStats(data);
            const ocrCacheStats = calculateStats(ocrCacheData);
            const auditcheckStats = calculateStats(auditcheckData);
            
            // สร้าง HTML
            let html = `
                <!-- สถิติสรุปรวม -->
                <div class="stats-grid">
                    <div class="stat-card blue">
                        <div class="stat-card-title">จำนวน Build ทั้งหมด</div>
                        <div class="stat-card-value">${stats.totalBuilds}</div>
                        <div class="stat-card-subtitle">
                            OCR Cache: ${ocrCacheStats.totalBuilds} | Auditcheck: ${auditcheckStats.totalBuilds}
                        </div>
                    </div>
                    <div class="stat-card green">
                        <div class="stat-card-title">จำนวนไฟล์ทั้งหมด</div>
                        <div class="stat-card-value">${stats.totalFiles.toLocaleString('th-TH')}</div>
                        <div class="stat-card-subtitle">
                            OCR Cache: ${ocrCacheStats.totalFiles.toLocaleString('th-TH')} | Auditcheck: ${auditcheckStats.totalFiles.toLocaleString('th-TH')}
                        </div>
                    </div>
                    <div class="stat-card yellow">
                        <div class="stat-card-title">จำนวนบริษัทที่อ่าน</div>
                        <div class="stat-card-value">${stats.totalCompanies}</div>
                        <div class="stat-card-subtitle">
                            OCR Cache: ${ocrCacheStats.totalCompanies} | Auditcheck: ${auditcheckStats.totalCompanies}
                        </div>
                    </div>
                </div>
                
                <!-- สรุปข้อมูลแยกตามประเภท -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px;">
                    <div class="stat-card" style="background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); border-left: 4px solid #60a5fa;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <div class="stat-card-title" style="color: white; font-size: 1.2em;">📊 ข้อมูล OCR ของเซอร์วิส</div>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                            <div>
                                <div style="color: rgba(255,255,255,0.8); font-size: 0.85em; margin-bottom: 5px;">Build</div>
                                <div style="color: white; font-size: 1.5em; font-weight: 700;">${ocrCacheStats.totalBuilds}</div>
                            </div>
                            <div>
                                <div style="color: rgba(255,255,255,0.8); font-size: 0.85em; margin-bottom: 5px;">ไฟล์</div>
                                <div style="color: white; font-size: 1.5em; font-weight: 700;">${ocrCacheStats.totalFiles.toLocaleString('th-TH')}</div>
                            </div>
                            <div>
                                <div style="color: rgba(255,255,255,0.8); font-size: 0.85em; margin-bottom: 5px;">บริษัท</div>
                                <div style="color: white; font-size: 1.5em; font-weight: 700;">${ocrCacheStats.totalCompanies}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="stat-card" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-left: 4px solid #34d399;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <div class="stat-card-title" style="color: white; font-size: 1.2em;">🔍 ข้อมูล OCR ของผู้ตรวจ</div>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                            <div>
                                <div style="color: rgba(255,255,255,0.8); font-size: 0.85em; margin-bottom: 5px;">Build</div>
                                <div style="color: white; font-size: 1.5em; font-weight: 700;">${auditcheckStats.totalBuilds}</div>
                            </div>
                            <div>
                                <div style="color: rgba(255,255,255,0.8); font-size: 0.85em; margin-bottom: 5px;">ไฟล์</div>
                                <div style="color: white; font-size: 1.5em; font-weight: 700;">${auditcheckStats.totalFiles.toLocaleString('th-TH')}</div>
                            </div>
                            <div>
                                <div style="color: rgba(255,255,255,0.8); font-size: 0.85em; margin-bottom: 5px;">บริษัท</div>
                                <div style="color: white; font-size: 1.5em; font-weight: 700;">${auditcheckStats.totalCompanies}</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- กราฟ -->
                <div class="charts-grid">
                    <div class="chart-card">
                        <h3>📊 จำนวนไฟล์ตาม Build</h3>
                        <div class="chart-container">
                            <canvas id="filesByBuildChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <h3>🏢 จำนวนไฟล์ตามบริษัท (Top 10)</h3>
                        <div class="chart-container">
                            <canvas id="filesByCompanyChart"></canvas>
                        </div>
                    </div>
                </div>
                
                <!-- Dropdown รายการบริษัทที่อ่าน -->
                <div class="table-card">
                    <h3>📋 รายการบริษัทที่อ่าน</h3>
                    <div style="margin-bottom: 20px;">
                        <select id="companyDropdown" style="width: 100%; padding: 12px; border: 1px solid #475569; border-radius: 8px; background: #0f172a; color: #fafafa; font-size: 14px; cursor: pointer;">
                            <option value="">-- เลือกบริษัท --</option>
                        </select>
                    </div>
                    <div id="companyDetails" style="display: none; background: #0f172a; padding: 20px; border-radius: 8px; border-left: 4px solid #667eea;">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px;">
                            <div>
                                <div style="color: #94a3b8; font-size: 0.9em; margin-bottom: 5px;">ชื่อบริษัท</div>
                                <div style="color: #60a5fa; font-weight: 600; font-size: 1.1em;" id="selectedCompanyName">-</div>
                            </div>
                            <div>
                                <div style="color: #94a3b8; font-size: 0.9em; margin-bottom: 5px;">เลขประจำตัวผู้เสียภาษี</div>
                                <div style="color: #cbd5e1; font-size: 1em;" id="selectedCompanyTaxId">-</div>
                            </div>
                            <div>
                                <div style="color: #94a3b8; font-size: 0.9em; margin-bottom: 5px;">จำนวนไฟล์</div>
                                <div style="color: #10b981; font-weight: 600; font-size: 1.1em;" id="selectedCompanyFiles">0</div>
                            </div>
                        </div>
                        <div id="selectedCompanyFileList" style="max-height: 200px; overflow-y: auto; background: #1e293b; padding: 15px; border-radius: 5px;">
                            <!-- รายชื่อไฟล์จะแสดงที่นี่ -->
                        </div>
                    </div>
                </div>
                
                <!-- Tab Navigation -->
                <div class="tab-navigation" style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #334155;">
                    <button class="tab-button active" onclick="switchDashboardTab('all')" id="dashboard-tab-all" style="padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 1em; font-weight: 600;">
                        📊 ทั้งหมด (${data.length})
                    </button>
                    <button class="tab-button" onclick="switchDashboardTab('ocr_cache')" id="dashboard-tab-ocr_cache" style="padding: 12px 24px; background: #475569; color: #cbd5e1; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 1em; font-weight: 600;">
                        📊 OCR Cache (${ocrCacheData.length})
                    </button>
                    <button class="tab-button" onclick="switchDashboardTab('auditcheck')" id="dashboard-tab-auditcheck" style="padding: 12px 24px; background: #475569; color: #cbd5e1; border: none; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 1em; font-weight: 600;">
                        🔍 Auditcheck (${auditcheckData.length})
                    </button>
                </div>
                
                <!-- ตารางสรุป -->
                <div class="table-card">
                    <h3>📋 สรุปข้อมูลตาม Build</h3>
                    <div style="max-height: 500px; overflow-y: auto;">
                        <!-- ตารางทั้งหมด -->
                        <table class="dashboard-table" id="dashboard-table-all">
                            <thead>
                                <tr>
                                    <th>ประเภท</th>
                                    <th>Build/Company</th>
                                    <th style="text-align: right;">จำนวนไฟล์</th>
                                    <th style="text-align: right;">จำนวนบริษัท</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.map((company, index) => `
                                    <tr class="clickable" onclick="toggleBuildDetails('all', ${index})" data-build-index="${index}">
                                        <td>
                                            <span style="padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: 600; ${company.data_source === 'auditcheck' ? 'background: #10b981; color: white;' : 'background: #3b82f6; color: white;'}">
                                                ${company.data_source === 'auditcheck' ? '🔍 Auditcheck' : '📊 OCR Cache'}
                                            </span>
                                        </td>
                                        <td>
                                            <strong>${company.company_name || 'ไม่ระบุ'}</strong>
                                            <span style="color: #94a3b8; font-size: 0.85em; margin-left: 10px;">▶</span>
                                        </td>
                                        <td class="amount-cell">${(company.total_documents || 0).toLocaleString('th-TH')}</td>
                                        <td class="amount-cell">${company.companies_read ? Object.keys(company.companies_read).length : 0}</td>
                                    </tr>
                                    <tr id="build-details-all-${index}" class="build-details-row">
                                        <td colspan="4" style="padding: 0;">
                                            <div class="build-details" id="build-details-content-all-${index}">
                                                ${company.companies_read && Object.keys(company.companies_read).length > 0 ? `
                                                    <div style="color: #fbbf24; font-weight: 600; margin-bottom: 15px; font-size: 1.1em;">
                                                        📋 รายละเอียดบริษัทที่อ่านใน Build นี้ (${Object.keys(company.companies_read).length} บริษัท)
                                                    </div>
                                                    ${Object.entries(company.companies_read).map(([companyName, companyData]) => `
                                                        <div class="company-item">
                                                            <div class="company-item-header">
                                                                <div class="company-item-name">${companyName || 'ไม่ระบุชื่อบริษัท'}</div>
                                                                <div class="company-item-stats">
                                                                    <div class="company-item-stat">
                                                                        <div class="company-item-stat-label">จำนวนไฟล์</div>
                                                                        <div class="company-item-stat-value">${(companyData.file_count || 0).toLocaleString('th-TH')} ไฟล์</div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                            ${companyData.tax_id ? `
                                                                <div style="color: #94a3b8; font-size: 0.9em; margin-bottom: 10px;">
                                                                    เลขประจำตัวผู้เสียภาษี: ${companyData.tax_id}
                                                                </div>
                                                            ` : ''}
                                                            ${companyData.filenames && companyData.filenames.length > 0 ? `
                                                                <div class="company-files-list">
                                                                    <div class="company-files-title">📄 รายชื่อไฟล์ทั้งหมด (${companyData.filenames.length} ไฟล์):</div>
                                                                    <div class="company-files-grid">
                                                                        ${companyData.filenames.map((filename, idx) => `
                                                                            <div class="file-item">${idx + 1}. ${filename || '-'}</div>
                                                                        `).join('')}
                                                                    </div>
                                                                </div>
                                                            ` : ''}
                                                        </div>
                                                    `).join('')}
                                                ` : `
                                                    <div style="color: #94a3b8; text-align: center; padding: 20px;">

        // ฟังก์ชันสร้าง dropdown รายการบริษัท
        function populateCompanyDropdown(data) {
            const dropdown = document.getElementById('companyDropdown');
            if (!dropdown) return;
            
            // รวบรวมข้อมูลบริษัททั้งหมด
            const allCompanies = {};
            
            data.forEach(build => {
                if (build.companies_read) {
                    Object.entries(build.companies_read).forEach(([companyName, companyData]) => {
                        if (!allCompanies[companyName]) {
                            allCompanies[companyName] = {
                                name: companyName,
                                tax_id: companyData.tax_id || '',
                                file_count: 0,
                                filenames: []
                            };
                        }
                        allCompanies[companyName].file_count += companyData.file_count || 0;
                        if (companyData.filenames) {
                            allCompanies[companyName].filenames.push(...companyData.filenames);
                        }
                    });
                }
            });
            
            // เรียงลำดับตามจำนวนไฟล์ (มากไปน้อย)
            const sortedCompanies = Object.values(allCompanies).sort((a, b) => b.file_count - a.file_count);
            
            // เพิ่ม options ใน dropdown
            sortedCompanies.forEach(company => {
                const option = document.createElement('option');
                option.value = company.name;
                option.textContent = `${company.name} (${company.file_count} ไฟล์)`;
                option.dataset.companyData = JSON.stringify(company);
                dropdown.appendChild(option);
            });
            
            // เพิ่ม event listener สำหรับ dropdown
            dropdown.addEventListener('change', function() {
                const selectedValue = this.value;
                const companyDetails = document.getElementById('companyDetails');
                
                if (!selectedValue) {
                    companyDetails.style.display = 'none';
                    return;
                }
                
                const selectedOption = this.options[this.selectedIndex];
                const companyData = JSON.parse(selectedOption.dataset.companyData);
                
                // แสดงรายละเอียดบริษัท
                document.getElementById('selectedCompanyName').textContent = companyData.name;
                document.getElementById('selectedCompanyTaxId').textContent = companyData.tax_id || '-';
                document.getElementById('selectedCompanyFiles').textContent = companyData.file_count.toLocaleString('th-TH') + ' ไฟล์';
                
                // แสดงรายชื่อไฟล์
                const fileListContainer = document.getElementById('selectedCompanyFileList');
                if (companyData.filenames && companyData.filenames.length > 0) {
                    fileListContainer.innerHTML = `
                        <div style="color: #94a3b8; font-size: 0.9em; margin-bottom: 10px;">รายชื่อไฟล์ทั้งหมด (${companyData.filenames.length} ไฟล์):</div>
                        <div style="display: grid; gap: 5px;">
                            ${companyData.filenames.map((filename, idx) => `
                                <div style="color: #cbd5e1; font-size: 0.85em; padding: 5px; background: #0f172a; border-radius: 3px;">
                                    ${idx + 1}. ${filename || '-'}
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else {
                    fileListContainer.innerHTML = '<div style="color: #94a3b8;">ไม่มีรายชื่อไฟล์</div>';
                }
                
                companyDetails.style.display = 'block';
            });
        }
        
        // ฟังก์ชันคำนวณสถิติ
        function calculateStats(data) {
            let totalBuilds = data.length;
            let totalFiles = 0;
            let totalCompanies = new Set();
            
            data.forEach(company => {
                totalFiles += company.total_documents || 0;
                
                if (company.companies_read) {
                    Object.keys(company.companies_read).forEach(companyName => {
                        if (companyName) {
                            totalCompanies.add(companyName);
                        }
                    });
                }
            });
            
            return {
                totalBuilds,
                totalFiles,
                totalCompanies: totalCompanies.size
            };
        }
        
        // ฟังก์ชันสร้างกราฟ
        function createCharts(data, stats) {
            const chartOptions = {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {

                    }

                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            color: '#94a3b8'
                        },
                        grid: {
                            color: '#334155'
                        }
                    },
                    x: {
                        ticks: {
                            color: '#94a3b8'
                        },
                        grid: {
                            color: '#334155'
                        }
                    }
                }
            };
            
            // กราฟจำนวนไฟล์ตาม Build
            const filesByBuildCtx = document.getElementById('filesByBuildChart').getContext('2d');
            charts.filesByBuild = new Chart(filesByBuildCtx, {
                type: 'bar',
                data: {
                    labels: data.map(c => c.company_name || 'ไม่ระบุ').slice(0, 15),
                    datasets: [{
                        label: 'จำนวนไฟล์',
                        data: data.map(c => c.total_documents || 0).slice(0, 15),
                        backgroundColor: 'rgba(96, 165, 250, 0.8)',
                        borderColor: 'rgba(96, 165, 250, 1)',
                        borderWidth: 1
                    }]
                },
                options: chartOptions
            });
            
            // กราฟจำนวนไฟล์ตามบริษัท (Top 10)
            const companyFiles = {};
            data.forEach(company => {
                if (company.companies_read) {
                    Object.entries(company.companies_read).forEach(([companyName, companyData]) => {
                        if (!companyFiles[companyName]) {
                            companyFiles[companyName] = 0;
                        }
                        companyFiles[companyName] += companyData.file_count || 0;
                    });
                }
            });
            
            const topCompanies = Object.entries(companyFiles)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 10);
            
            const filesByCompanyCtx = document.getElementById('filesByCompanyChart').getContext('2d');
            charts.filesByCompany = new Chart(filesByCompanyCtx, {
                type: 'doughnut',
                data: {
                    labels: topCompanies.map(([name]) => name.length > 30 ? name.substring(0, 30) + '...' : name),

                        label: 'จำนวนไฟล์',
                        data: topCompanies.map(([, count]) => count),

                            'rgba(96, 165, 250, 0.8)',
                            'rgba(16, 185, 129, 0.8)',
                            'rgba(251, 191, 36, 0.8)',
                            'rgba(167, 139, 250, 0.8)',
                            'rgba(236, 72, 153, 0.8)',
                            'rgba(239, 68, 68, 0.8)',
                            'rgba(34, 197, 94, 0.8)',
                            'rgba(59, 130, 246, 0.8)',
                            'rgba(168, 85, 247, 0.8)',
                            'rgba(245, 158, 11, 0.8)'
                        ],
                        borderColor: '#1e293b',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                color: '#cbd5e1',

        // ฟังก์ชันจัดรูปแบบเงิน (แบบสั้น)
        function formatCurrencyShort(amount) {
            if (!amount || amount === 0) return '0';
            if (amount >= 1000000) {
                return (amount / 1000000).toFixed(2) + 'M';
            } else if (amount >= 1000) {
                return (amount / 1000).toFixed(2) + 'K';
            }
            return amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        
        // ฟังก์ชันจัดรูปแบบเงิน
        function formatCurrency(amount) {
            if (!amount || amount === 0) return '0.00';
            return amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        
        // ฟังก์ชันสลับ Tab ใน Dashboard
        function switchDashboardTab(tabName) {
            // ซ่อนทุกตาราง
            document.querySelectorAll('.dashboard-table').forEach(table => {
                table.style.display = 'none';
            });
            
            // Reset ทุก Tab Button
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.style.background = '#475569';
                btn.style.color = '#cbd5e1';
            });
            
            // แสดงตารางที่เลือก
            const selectedTable = document.getElementById(`dashboard-table-${tabName}`);
            if (selectedTable) {
                selectedTable.style.display = 'table';
            }
            
            // Highlight Tab Button ที่เลือก
            const selectedButton = document.getElementById(`dashboard-tab-${tabName}`);
            if (selectedButton) {
                selectedButton.style.background = tabName === 'all' ? '#667eea' : (tabName === 'ocr_cache' ? '#3b82f6' : '#10b981');
                selectedButton.style.color = 'white';
            }
        }
        
        // ฟังก์ชันเปิด/ปิดรายละเอียด Build
        function toggleBuildDetails(tabName, index) {
            const detailsRow = document.getElementById(`build-details-${tabName}-${index}`);
            const detailsContent = document.getElementById(`build-details-content-${tabName}-${index}`);
            const buildRow = document.querySelector(`#dashboard-table-${tabName} tr[data-build-index="${index}"]`);
            
            if (!detailsRow || !detailsContent || !buildRow) return;
            
            const isExpanded = detailsContent.classList.contains('expanded');
            
            // ปิดรายละเอียดทั้งหมดในตารางเดียวกันก่อน
            const table = document.getElementById(`dashboard-table-${tabName}`);
            if (table) {
                table.querySelectorAll('.build-details').forEach(el => {
                    el.classList.remove('expanded');
                });
                table.querySelectorAll('tr.clickable').forEach(tr => {
                    const span = tr.querySelector('span');
                    if (span) span.textContent = '▶';
                });
            }
            
            // ถ้ายังไม่ได้เปิด ให้เปิด
            if (!isExpanded) {
                detailsContent.classList.add('expanded');
                const span = buildRow.querySelector('span');
                if (span) span.textContent = '▼';
                
                // Scroll ไปที่รายละเอียด
                setTimeout(() => {
                    detailsContent.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 100);
            }
        }
        
        // ฟังก์ชันส่งออก Excel
        async function exportToExcel() {
            try {
                // แสดง loading
                const originalContent = document.getElementById('dashboardContent').innerHTML;
                document.getElementById('dashboardContent').innerHTML = `
                    <div class="loading">
                        <p>⏳ กำลังสร้างไฟล์ Excel...</p>
                    </div>
                `;
                
                // ดาวน์โหลดไฟล์ Excel
                const response = await fetch('/api/filing-summary/export-excel');
                
                if (!response.ok) {
                    if (response.status === 403) {
                        alert('⚠️ คุณไม่มีสิทธิ์เข้าถึง');
                        return;
                    }
                    const errorData = await response.json();
                    throw new Error(errorData.message || 'ไม่สามารถสร้างไฟล์ Excel ได้');
                }
                
                // ดาวน์โหลดไฟล์
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `filing_summary_${new Date().toISOString().slice(0, 10)}.xlsx`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(url);
                
                // คืนค่าเนื้อหาเดิม
                document.getElementById('dashboardContent').innerHTML = originalContent;
                
                // โหลดข้อมูลใหม่
                loadDashboardData();
                
                alert('✅ ส่งออก Excel สำเร็จ');
            } catch (error) {
                console.error('Error exporting Excel:', error);
                alert('❌ เกิดข้อผิดพลาดในการส่งออก Excel: ' + error.message);
                
                // คืนค่าเนื้อหาเดิม
                loadDashboardData();
            }
        }
