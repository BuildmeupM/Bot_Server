                // ถ้าไม่มี Pay-in แต่มีแบบภาษีที่มียอดชำระ > 0 ให้แจ้งเตือน
                if (totalTaxAmount > 0) {
                    alert(`⚠️ ไม่พบยอด Pay-in!\n\n` +
                          `ระบบตรวจพบแบบภาษีที่มียอดรวม: ${totalTaxAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท\n` +
                          `แต่ไม่พบยอด Pay-in ที่สอดคล้องกัน\n\n` +
                          `กรุณาตรวจสอบว่ามีการอัปโหลดไฟล์ Pay-in และระบบอ่านข้อมูลได้ถูกต้องหรือไม่`);
                    return false;
                }
                // ถ้าไม่มี Pay-in และไม่มีแบบภาษีที่มียอดชำระ → ผ่าน (กรณีไม่มีข้อมูล)
                return true;
            }
            
            // ตรวจสอบว่ามีแบบภาษีหรือไม่
            if (totalTaxAmount === 0) {
                // ถ้ามี Pay-in แต่ไม่มีแบบภาษี → แจ้งเตือน
                alert(`⚠️ ไม่พบยอดแบบภาษี!\n\n` +
                      `ระบบตรวจพบยอด Pay-in: ${payInAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท\n` +
                      `แต่ไม่พบยอดแบบภาษีที่สอดคล้องกัน\n\n` +
                      `กรุณาตรวจสอบว่ามีการอัปโหลดไฟล์แบบภาษีและระบบอ่านข้อมูลได้ถูกต้องหรือไม่`);
                return false;
            }
            
            // ตรวจสอบว่าผลรวมเท่ากันหรือไม่ (ยอมรับความแตกต่างไม่เกิน 0.01 บาท)
            const difference = Math.abs(totalTaxAmount - payInAmount);
            if (difference > 0.01) {
                alert(`⚠️ ยอดรวมไม่ตรงกัน!\n\n` +
                      `ยอดรวมแบบภาษี (ภ.ง.ด.1 + ภ.ง.ด.3 + ภ.ง.ด.53 + ภ.ง.ด.54 + ภ.พ.36 + ภ.พ.30): ${totalTaxAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท\n` +
                      `ยอดชำระ (Pay-in): ${payInAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท\n` +
                      `ความแตกต่าง: ${difference.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท\n\n` +
                      `กรุณาตรวจสอบข้อมูลก่อนส่งอีเมล`);
                return false;
            }
            
            return true;
        }
        
        // ฟังก์ชันแปลงวันที่จากรูปแบบต่างๆ เป็น dd/mm/yyyy
        function convertDateToDDMMYYYY(dateObj) {
            if (!dateObj) return null;
            
            const monthMap = {
                'มกราคม': '01', 'กุมภาพันธ์': '02', 'มีนาคม': '03', 'เมษายน': '04',
                'พฤษภาคม': '05', 'มิถุนายน': '06', 'กรกฎาคม': '07', 'สิงหาคม': '08',
                'กันยายน': '09', 'ตุลาคม': '10', 'พฤศจิกายน': '11', 'ธันวาคม': '12'
            };
            
            let day = dateObj.day || '';
            let month = dateObj.month || '';
            let year = dateObj.year || '';
            
            // ถ้า month เป็นชื่อเดือน ให้แปลงเป็นตัวเลข
            if (monthMap[month]) {
                month = monthMap[month];
            } else if (month && month.length === 1) {
                month = '0' + month;
            }
            
            // แปลง day ให้เป็น 2 หลัก
            if (day && day.length === 1) {
                day = '0' + day;
            }
            
            // ถ้า year เป็น พ.ศ. (4 หลัก) ให้ใช้ตามนั้น
            if (year && year.length === 4 && day && month) {
                return `${day}/${month}/${year}`;
            }
            
            return null;
        }
        
        // ฟังก์ชันอัปเดตวันที่ชำระจาก Pay-in ชำระภาษี เท่านั้น (ห้ามดึงจากที่อื่น)
        function updatePaymentDueDateFromOCR() {
            const paymentDueDateField = document.getElementById('paymentDueDate');
            if (!paymentDueDateField) return;
            
            // หา Pay-in ชำระภาษี เท่านั้น (ไม่ดึงจากที่อื่น)
            let dueDate = null;
            let kysDueDate = null; // สำหรับเก็บวันที่ครบกำหนดของ กยศ. (ใช้เฉพาะใน email content เท่านั้น)
            
            uploadedTaxFilingFiles.forEach(file => {
                if (file.ocr_result && file.ocr_result.success) {
                    const ocrResult = file.ocr_result;
                    const taxFormType = ocrResult.tax_form_type || '';
                    
                    // หา Pay-in ชำระภาษี เท่านั้น (ไม่รวม กยศ. หรือแบบอื่นๆ)
                    if (taxFormType.includes('Pay-in') && !taxFormType.includes('กองทุน กยศ.') && !taxFormType.includes('กยศ.')) {
                        if (ocrResult.due_date) {
                            // ตรวจสอบว่า due_date เป็น string (รูปแบบ DD/MM/YYYY) หรือ object
                            if (typeof ocrResult.due_date === 'string') {
                                // ถ้าเป็น string ให้ใช้ตรงๆ (เพราะ parse มาเป็น DD/MM/YYYY แล้ว)
                                dueDate = ocrResult.due_date;
                            } else if (typeof ocrResult.due_date === 'object') {
                                // ถ้าเป็น object ให้แปลงด้วย convertDateToDDMMYYYY
                            dueDate = convertDateToDDMMYYYY(ocrResult.due_date);
                            }
                        }
                    }
                    
                    // หา กยศ. (กองทุน กยศ.) - เก็บไว้สำหรับใช้ใน email content เท่านั้น (ไม่ใช้ใน paymentDueDateField)
                    if (taxFormType.includes('กองทุน กยศ.') || taxFormType.includes('กยศ.')) {
                        if (ocrResult.due_date || ocrResult.expiry_date) {
                            const dateToUse = ocrResult.due_date || ocrResult.expiry_date;
                            // ตรวจสอบว่า due_date เป็น string (รูปแบบ DD/MM/YYYY) หรือ object
                            if (typeof dateToUse === 'string') {
                                kysDueDate = dateToUse;
                            } else if (typeof dateToUse === 'object') {
                                kysDueDate = convertDateToDDMMYYYY(dateToUse);
                            }
                        }
                    }
                }
            });

        // ฟังก์ชันตรวจสอบความตรงกันของยอดภาษีและ Pay-in
        function checkPaymentMatch(taxTotal, payInAmount) {
            const payInField = document.getElementById('summaryAmountPayIn');
            const statusElement = document.getElementById('paymentMatchStatus');
            
            if (!payInField || !statusElement) return;
            
            // ถ้าไม่มียอด Pay-in ให้ซ่อน status
            if (payInAmount === 0) {
                statusElement.style.display = 'none';
                payInField.style.borderColor = '#475569';
                payInField.style.color = '#fafafa';
                return;
            }
            
            // เปรียบเทียบยอด (อนุญาตความคลาดเคลื่อน 0.01 บาท)
            const difference = Math.abs(taxTotal - payInAmount);
            const isMatch = difference < 0.02;
            
            // แสดง status
            statusElement.style.display = 'block';
            
            if (isMatch) {
                // สีเขียว - ยอดตรงกัน
                payInField.style.borderColor = '#27ae60';
                payInField.style.color = '#27ae60';
                statusElement.style.color = '#27ae60';
                statusElement.textContent = `✓ ยอดตรงกัน: ${taxTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท`;
                console.log('✅ ยอดภาษีและ Pay-in ตรงกัน');
            } else {
                // สีแดง - ยอดไม่ตรงกัน
                payInField.style.borderColor = '#e74c3c';
                payInField.style.color = '#e74c3c';
                statusElement.style.color = '#e74c3c';
                statusElement.textContent = `✗ ยอดไม่ตรงกัน: ภาษีรวม ${taxTotal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท vs Pay-in ${payInAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท (ต่าง ${difference.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} บาท)`;

        // ฟังก์ชันสำหรับแสดงและตรวจสอบเดือนของแต่ละแบบภาษี
        function updateMonthSummary() {
            const monthSummaryEl = document.getElementById('monthSummary');
            const monthDetailsEl = document.getElementById('monthDetails');
            const monthWarningEl = document.getElementById('monthWarning');
            const monthWarningDetailsEl = document.getElementById('monthWarningDetails');
            
            if (!monthSummaryEl || !monthDetailsEl) return;
            
            // รวบรวมข้อมูลเดือนจากทุกไฟล์
            const monthData = {};
            const monthMap = {
                'มกราคม': 1, 'กุมภาพันธ์': 2, 'มีนาคม': 3, 'เมษายน': 4,
                'พฤษภาคม': 5, 'มิถุนายน': 6, 'กรกฎาคม': 7, 'สิงหาคม': 8,
                'กันยายน': 9, 'ตุลาคม': 10, 'พฤศจิกายน': 11, 'ธันวาคม': 12
            };
            
            // ฟังก์ชันแปลงเดือนเป็นตัวเลข
            function parseMonth(monthValue, yearValue) {
                if (!monthValue && !yearValue) return null;
                
                let monthNum = null;
                let yearNum = null;
                
                // Parse ปี
                if (yearValue) {
                    const yearMatch = String(yearValue).match(/(\d{4})/);
                    if (yearMatch) {
                        yearNum = parseInt(yearMatch[1]);
                    }
                }
                
                // Parse เดือน
                if (monthValue) {
                    const monthStr = String(monthValue);
                    
                    // ลองหาเลขเดือน (1-12)
                    const monthMatch = monthStr.match(/(\d{1,2})/);
                    if (monthMatch) {
                        const num = parseInt(monthMatch[1]);
                        if (num >= 1 && num <= 12) {
                            monthNum = num;
                        }
                    }
                    
                    // ถ้ายังหาไม่เจอ ลองหาชื่อเดือน
                    if (monthNum === null) {
                        for (const [name, num] of Object.entries(monthMap)) {
                            if (monthStr.includes(name)) {
                                monthNum = num;
                                break;
                            }
                        }
                    }
                    
                    // สำหรับ กยศ. ที่มีรูปแบบ mm/yyyy
                    if (monthNum === null) {
                        const kysMatch = monthStr.match(/(\d{1,2})\/(\d{4})/);
                        if (kysMatch) {
                            monthNum = parseInt(kysMatch[1]);
                            yearNum = parseInt(kysMatch[2]);
                        }
                    }
                }
                
                return { month: monthNum, year: yearNum };
            }

                                    if (yearMatch) {
                                        yearNum = parseInt(yearMatch[1]);
                                    }
                                }
                                
                                if (monthNum || yearNum) {
                                    monthInfo = { month: monthNum, year: yearNum };
                                    const monthName = monthNameStr || (monthNum ? Object.keys(monthMap).find(k => monthMap[k] === monthNum) : '');
                                    displayText = `${monthName || monthNum || ''} ${yearNum || ''}`.trim();
                                }
                            }
                        }
                        // Fallback: ใช้ month/year จาก ocrResult
                        if (!monthInfo) {
                            monthInfo = parseMonth(ocrResult.month, ocrResult.year);
                            if (monthInfo && monthInfo.month) {
                                const monthName = Object.keys(monthMap).find(k => monthMap[k] === monthInfo.month);
                                displayText = `${monthName || monthInfo.month} ${monthInfo.year || ''}`;
                            }
                        }
                    } else if (taxFormType.includes('ภ.ง.ด.1') || taxFormType.includes('ภ.ง.ด.3') || 
                        taxFormType.includes('ภ.ง.ด.53') || taxFormType.includes('ภ.พ.30') || taxFormType.includes('ภพ.30')) {
                        monthInfo = parseMonth(ocrResult.month, ocrResult.year);
                        if (monthInfo && monthInfo.month) {
                            const monthName = Object.keys(monthMap).find(k => monthMap[k] === monthInfo.month);
                            displayText = `${monthName || monthInfo.month} ${monthInfo.year || ''}`;
                        }
                    } else if (taxFormType.includes('กยศ.') || taxFormType.includes('กองทุน')) {
                        const paymentMonth = ocrResult.payment_month || '';
                        if (paymentMonth) {
                            const kysMatch = paymentMonth.match(/(\d{1,2})\/(\d{4})/);
                            if (kysMatch) {
                                monthInfo = { month: parseInt(kysMatch[1]), year: parseInt(kysMatch[2]) };
                                displayText = paymentMonth;
                            } else {
                                displayText = paymentMonth;
                            }
                        }
                    }
                    
                    if (monthInfo && monthInfo.month) {
                        const key = `${taxFormType}_${monthInfo.month}_${monthInfo.year || 'unknown'}`;
                        if (!monthData[key]) {
                            monthData[key] = {
                                taxFormType: taxFormType,
                                month: monthInfo.month,
                                year: monthInfo.year,
                                displayText: displayText,
                                files: [],
                                isSupplement: isSupplement
                            };
                        }
                        monthData[key].files.push({ fileName, isSupplement });
                    } else if (displayText) {
                        // ถ้าไม่มีข้อมูลเดือนที่ parse ได้ แต่มีข้อความแสดง
                        const key = `${taxFormType}_${displayText}`;
                        if (!monthData[key]) {
                            monthData[key] = {
                                taxFormType: taxFormType,
                                month: null,
                                year: null,
                                displayText: displayText,
                                files: [],
                                isSupplement: isSupplement
                            };
                        }
                        monthData[key].files.push({ fileName, isSupplement });
                    }
                }
            });
            
            // ถ้าไม่มีข้อมูลเดือน ให้ซ่อน component
            if (Object.keys(monthData).length === 0) {
                monthSummaryEl.style.display = 'none';
                return;
            }
            
            // แสดง component
            monthSummaryEl.style.display = 'block';
            
            // จัดกลุ่มตาม tax form type
            const groupedByType = {};
            Object.values(monthData).forEach(data => {
                if (!groupedByType[data.taxFormType]) {
                    groupedByType[data.taxFormType] = [];
                }
                groupedByType[data.taxFormType].push(data);
            });
            
            // สร้าง HTML สำหรับแสดงเดือน (จัดกลุ่มตามแบบภาษี)
            let html = '';
            const normalMonths = [];
            const supplementMonths = [];
            
            Object.keys(groupedByType).forEach(taxFormType => {
                const items = groupedByType[taxFormType];
                const totalFiles = items.reduce((sum, item) => sum + item.files.length, 0);
                const hasMultipleItems = items.length > 1;
                const uniqueId = `monthGroup_${taxFormType.replace(/[^a-zA-Z0-9]/g, '_')}`;
                
                // หาเดือนที่พบบ่อยที่สุดสำหรับ badge
                const monthCounts = {};
                items.forEach(item => {
                    if (item.month && item.year) {
                        const key = `${item.month}_${item.year}`;
                        monthCounts[key] = (monthCounts[key] || 0) + item.files.length;
                    }
                });
                const mostCommonMonth = Object.keys(monthCounts).reduce((a, b) => 
                    monthCounts[a] > monthCounts[b] ? a : b, Object.keys(monthCounts)[0]
                );
                const [commonMonth, commonYear] = mostCommonMonth ? mostCommonMonth.split('_').map(Number) : [null, null];
                const monthName = commonMonth ? Object.keys(monthMap).find(k => monthMap[k] === commonMonth) : '';
                const displayMonthYear = commonMonth && commonYear ? `${monthName || commonMonth} ${commonYear}` : items[0].displayText || 'ไม่ระบุเดือน';
                
                // ตรวจสอบว่าเป็นแบบเพิ่มเติมหรือไม่ (ถ้ามีอย่างน้อย 1 รายการเป็นเพิ่มเติม)
                const hasSupplement = items.some(item => item.isSupplement);
                const badgeColor = hasSupplement ? '#f59e0b' : '#10b981';
                const badgeText = hasSupplement ? 'เพิ่มเติม' : 'ปกติ';
                
                html += `
                    <div style="padding: 8px; background: #0f172a; border-radius: 6px; border: 1px solid #334155; margin-bottom: 8px;">
                        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; cursor: ${hasMultipleItems ? 'pointer' : 'default'};" 
                             onclick="${hasMultipleItems ? `toggleMonthGroup('${uniqueId}')` : ''}">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                ${hasMultipleItems ? `
                                    <svg id="${uniqueId}_icon" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" style="color: #94a3b8; transition: transform 0.2s;">
                                        <path d="M3 4.5L6 7.5L9 4.5"/>
                                    </svg>
                                ` : ''}
                                <span style="color: #cbd5e1; font-weight: bold; font-size: 12px;">${taxFormType} ${totalFiles > 1 ? `(${totalFiles} ไฟล์)` : ''}</span>
                            </div>
                            <span style="padding: 2px 8px; background: ${badgeColor}; color: white; border-radius: 4px; font-size: 10px; font-weight: bold;">${badgeText}</span>
                        </div>
                        <div style="color: #94a3b8; font-size: 11px; margin-bottom: 4px;">${displayMonthYear}</div>
                        <div id="${uniqueId}_details" style="display: ${hasMultipleItems ? 'none' : 'block'}; color: #64748b; font-size: 10px; margin-top: 4px;">
                            ${items.map((item, itemIdx) => {
                                const fileList = item.files.map(f => f.fileName);
                                return `
                                    <div style="margin-bottom: ${itemIdx < items.length - 1 ? '8px' : '0'}; padding-left: ${hasMultipleItems ? '16px' : '0'}; border-left: ${hasMultipleItems ? '2px solid #334155' : 'none'}; padding-left: ${hasMultipleItems ? '12px' : '0'};">
                                        ${hasMultipleItems ? `<div style="color: #94a3b8; font-size: 10px; margin-bottom: 4px; font-weight: bold;">${item.displayText || 'ไม่ระบุเดือน'}</div>` : ''}
                                        ${fileList.map((fileName, idx) => `<div style="margin-top: 2px;">${idx + 1}. ${fileName}</div>`).join('')}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
                
                // รวบรวมเดือนสำหรับการตรวจสอบความสอดคล้อง
                items.forEach(item => {
                    if (item.month && item.year) {
                        if (item.isSupplement) {
                            supplementMonths.push({ month: item.month, year: item.year });
                        } else {
                            normalMonths.push({ month: item.month, year: item.year });
                        }
                    }
                });
            });
            
            monthDetailsEl.innerHTML = html;
            
            // รีเซ็ตข้อมูลเดือนที่ไม่ตรงกัน
            monthMismatchData = {
                hasMismatch: false,
                normalMismatch: [],
                supplementMismatch: [],
                commonMonth: null,
                commonYear: null
            };
            
            // ตรวจสอบความสอดคล้องของเดือน
            if (normalMonths.length > 0) {
                // หาเดือนที่พบบ่อยที่สุด (สำหรับแบบยื่นปกติ)
                const monthCounts = {};
                normalMonths.forEach(m => {
                    const key = `${m.month}_${m.year}`;
                    monthCounts[key] = (monthCounts[key] || 0) + 1;
                });
                
                const mostCommonMonth = Object.keys(monthCounts).reduce((a, b) => 
                    monthCounts[a] > monthCounts[b] ? a : b
                );
                
                const [commonMonth, commonYear] = mostCommonMonth.split('_').map(Number);
                
                // ตรวจสอบว่ามีเดือนที่ไม่ตรงกันหรือไม่
                const mismatchedMonths = normalMonths.filter(m => 
                    m.month !== commonMonth || m.year !== commonYear
                );
                
                if (mismatchedMonths.length > 0) {
                    // บันทึกข้อมูลเดือนที่ไม่ตรงกัน
                    monthMismatchData.hasMismatch = true;
                    monthMismatchData.normalMismatch = mismatchedMonths;
                    monthMismatchData.commonMonth = commonMonth;
                    monthMismatchData.commonYear = commonYear;
                    
                    // แสดงคำเตือน
                    monthWarningEl.style.display = 'block';
                    
                    const mismatchedDetails = mismatchedMonths.map(m => {
                        const monthName = Object.keys(monthMap).find(k => monthMap[k] === m.month);
                        return `${monthName || m.month} ${m.year}`;
                    }).join(', ');
                    
                    const commonMonthName = Object.keys(monthMap).find(k => monthMap[k] === commonMonth);
                    monthWarningDetailsEl.innerHTML = `
                        <div style="margin-top: 6px;">
                            <strong>เดือนที่พบบ่อยที่สุด:</strong> ${commonMonthName || commonMonth} ${commonYear}<br>
                            <strong>เดือนที่ไม่ตรงกัน:</strong> ${mismatchedDetails}
                        </div>
                    `;
                    
                    // แสดง popup แจ้งเตือนทันที
                    setTimeout(() => {
                        checkAndShowMonthMismatchPopup();
                    }, 500);
                } else {
                    // ซ่อนคำเตือน
                    monthWarningEl.style.display = 'none';
                }
            } else {
                // ถ้ามีแต่แบบยื่นเพิ่มเติม ให้ซ่อนคำเตือน
                monthWarningEl.style.display = 'none';
            }
            
            // ตรวจสอบแบบยื่นเพิ่มเติม
            if (supplementMonths.length > 0) {
                const supplementMonthCounts = {};
                supplementMonths.forEach(m => {
                    const key = `${m.month}_${m.year}`;
                    supplementMonthCounts[key] = (supplementMonthCounts[key] || 0) + 1;
                });
                
                const supplementKeys = Object.keys(supplementMonthCounts);
                if (supplementKeys.length > 1) {
                    // มีเดือนที่ไม่ตรงกันในแบบยื่นเพิ่มเติม
                    const supplementCommonMonth = supplementKeys.reduce((a, b) => 
                        supplementMonthCounts[a] > supplementMonthCounts[b] ? a : b
                    );
                    const [supplementCommonMonthNum, supplementCommonYearNum] = supplementCommonMonth.split('_').map(Number);
                    
                    const supplementMismatched = supplementMonths.filter(m => 
                        m.month !== supplementCommonMonthNum || m.year !== supplementCommonYearNum
                    );
                    
                    if (supplementMismatched.length > 0) {
                        monthMismatchData.hasMismatch = true;
                        monthMismatchData.supplementMismatch = supplementMismatched;
                    }
                }
            }
        }
        
        // ฟังก์ชันสำหรับนับและแสดงจำนวนแบบยื่นปกติและแบบยื่นเพิ่มเติม
        function updateFilingTypeSummary() {
            let normalCount = 0;
            let supplementCount = 0;
            
            // นับจากไฟล์แบบยื่นภาษีทั้งหมด
            uploadedTaxFilingFiles.forEach(file => {
                if (file.ocr_result && file.ocr_result.success) {
                    const ocrResult = file.ocr_result;
                    const taxFormType = ocrResult.tax_form_type || '';
                    
                    // ตรวจสอบว่าเป็น ภ.พ.36 หรือไม่ (เพราะมี JSON structure ใหม่)
                    if (taxFormType.includes('ภ.พ.36') || taxFormType.includes('ภพ.36')) {
                        // ตรวจสอบจาก pp36_json
                        if (ocrResult.pp36_json) {
                            const pp36Json = ocrResult.pp36_json;
                            const dataObj = pp36Json.data || pp36Json;
                            
                            // ตรวจสอบว่าอันไหนมีข้อมูล (ไม่เป็น null)
                            const filingTypeNormal = dataObj['(1) ยื่นปกติ'];
                            const filingTypeSupplement = dataObj['(2) ยื่นเพิ่มเติมครั้งที่'];
                            
                            if (filingTypeNormal !== null && filingTypeNormal !== undefined && filingTypeNormal !== '') {
                                normalCount++;
                            } else if (filingTypeSupplement !== null && filingTypeSupplement !== undefined && filingTypeSupplement !== '') {
                                supplementCount++;
                            }
                        } else if (ocrResult.filing_type) {
                            // ถ้าไม่มี pp36_json แต่มี filing_type จาก OCR
                            if (ocrResult.filing_type.includes('ปกติ') || ocrResult.filing_type === 'normal') {
                                normalCount++;
                            } else if (ocrResult.filing_type.includes('เพิ่มเติม') || ocrResult.filing_type === 'supplement') {
                                supplementCount++;
                            }
                        }
                    } else {
                        // สำหรับแบบภาษีอื่นๆ ตรวจสอบจาก filing_type
                        if (ocrResult.filing_type) {
                            if (ocrResult.filing_type.includes('ปกติ') || ocrResult.filing_type === 'normal') {
                                normalCount++;
                            } else if (ocrResult.filing_type.includes('เพิ่มเติม') || ocrResult.filing_type === 'supplement') {
                                supplementCount++;
                            }
                        }
                    }
                }
            });
            
            // อัปเดต UI
            const summaryContainer = document.getElementById('filingTypeSummary');
            const normalCountEl = document.getElementById('normalFilingCount');
            const supplementCountEl = document.getElementById('supplementFilingCount');
            
            if (summaryContainer && normalCountEl && supplementCountEl) {
                // อัปเดตตัวเลข
                normalCountEl.textContent = normalCount;
                supplementCountEl.textContent = supplementCount;
                
                // แสดงหรือซ่อน container ตามว่ามีข้อมูลหรือไม่
                if (normalCount > 0 || supplementCount > 0) {
                    summaryContainer.style.display = 'block';
                } else {
                    summaryContainer.style.display = 'none';
                }
                
                console.log(`📊 [Filing Type Summary] แบบยื่นปกติ: ${normalCount}, แบบยื่นเพิ่มเติม: ${supplementCount}`);
            }
        }
        
        // ฟังก์ชันสำหรับอัปเดตข้อมูลสรุปทั้งหมดจาก OCR อัตโนมัติ
        function updateSummaryDataFromOCR() {
            // **รีเซ็ตและใช้ข้อมูลจากไฟล์ล่าสุด (ไม่ใช่แค่ไฟล์แรก)**
            let ocrData = null;
            
            // หาไฟล์ล่าสุดที่มี OCR สำเร็จ (เรียงจากหลังมาหน้า)
            for (let i = uploadedTaxFilingFiles.length - 1; i >= 0; i--) {
                const file = uploadedTaxFilingFiles[i];
                if (file.ocr_result && file.ocr_result.success) {
                    ocrData = file.ocr_result;
                    console.log('🔄 ใช้ข้อมูล OCR จากไฟล์ล่าสุด:', file.filename);
                    break;
                }
            }
            
            // อัปเดตชื่อบริษัท (รีเซ็ตทุกครั้ง)
            const summaryCompanyField = document.getElementById('summaryCompany');
            if (summaryCompanyField) {
                let companyName = null;
                
                // สำหรับ ภ.พ.36: ดึงชื่อบริษัทจาก JSON structure ใหม่ (ถ้ามี)
                if (ocrData && ocrData.tax_form_type && (ocrData.tax_form_type.includes('ภ.พ.36') || ocrData.tax_form_type.includes('ภพ.36'))) {
                    if (ocrData.pp36_json) {
                        const pp36Json = ocrData.pp36_json;
                        const dataObj = pp36Json.data || pp36Json;
                        if (dataObj['ชื่อบริษัท'] && dataObj['ชื่อบริษัท'] !== null && dataObj['ชื่อบริษัท'] !== '') {
                            companyName = dataObj['ชื่อบริษัท'];
                        }
                    }
                }
                
                // ถ้าไม่มีจาก JSON structure ใหม่ ให้ใช้จาก OCR ตามเดิม
                if (!companyName && ocrData && ocrData.company_name) {
                    companyName = ocrData.company_name;
                }
                
                if (companyName) {
                    summaryCompanyField.value = companyName;
                    console.log('✅ อัปเดตชื่อบริษัท:', companyName);
                } else if (uploadedTaxFilingFiles.length === 0) {
                    // ถ้าไม่มีไฟล์เหลืออยู่ ให้ลบข้อมูล
                    summaryCompanyField.value = '';
                }
            }
            
            // อัปเดตเลขที่นิติบุคคล (รีเซ็ตทุกครั้ง)
            const summaryTaxIdField = document.getElementById('summaryTaxId');
            if (summaryTaxIdField) {
                let taxId = null;
                let isPP36ForSummary = false;
                
                // สำหรับ ภ.พ.36: ดึงเลขประจำตัวผู้เสียภาษีอากรจาก JSON structure ใหม่ (ใช้ค่าตามที่อ่านได้ ไม่ format)
                if (ocrData && ocrData.tax_form_type && (ocrData.tax_form_type.includes('ภ.พ.36') || ocrData.tax_form_type.includes('ภพ.36'))) {
                    isPP36ForSummary = true;
                    if (ocrData.pp36_json) {
                        const pp36Json = ocrData.pp36_json;
                        const dataObj = pp36Json.data || pp36Json;
                        if (dataObj['เลขประจำตัวผู้เสียภาษีอากร'] && dataObj['เลขประจำตัวผู้เสียภาษีอากร'] !== null && dataObj['เลขประจำตัวผู้เสียภาษีอากร'] !== '') {
                            taxId = dataObj['เลขประจำตัวผู้เสียภาษีอากร'];
                        }
                    }
                }
                
                // ถ้าไม่มีจาก JSON structure ใหม่ ให้ใช้จาก OCR ตามเดิม
                if (!taxId && ocrData && ocrData.tax_id) {
                    taxId = ocrData.tax_id;
                }
                
                if (taxId) {
                    // สำหรับ ภ.พ.36: แสดงค่าตามที่อ่านได้จาก JSON (ไม่ format)
                    // สำหรับแบบภาษีอื่นๆ: แปลงเลขที่นิติบุคคลเป็นรูปแบบที่มี dash
                    if (!isPP36ForSummary) {
                        // แปลงเลขที่นิติบุคคลเป็นรูปแบบที่มี dash (เฉพาะแบบภาษีอื่นๆ)
                        taxId = taxId.replace(/\s+/g, '');
                    if (taxId.length === 13) {
                        taxId = `${taxId.substring(0, 5)}-${taxId.substring(5, 10)}-${taxId.substring(10, 12)}-${taxId.substring(12)}`;
                        }
                    }
                    summaryTaxIdField.value = taxId;
                    console.log('✅ อัปเดตเลขประจำตัวผู้เสียภาษีอากร:', taxId);
                } else if (uploadedTaxFilingFiles.length === 0) {
                    // ถ้าไม่มีไฟล์เหลืออยู่ ให้ลบข้อมูล
                    summaryTaxIdField.value = '';
                }
            }
            
            // อัปเดตระยะเวลา (รีเซ็ตทุกครั้ง)
            const summaryPeriodField = document.getElementById('summaryPeriod');
            if (summaryPeriodField) {
                if (ocrData && ocrData.filing_period) {
                    const month = ocrData.filing_period.month;
                    const year = ocrData.filing_period.year;
                    if (month && year) {
                        // แปลงเดือนเป็นตัวเลข (มกราคม=1, กุมภาพันธ์=2, ...)
                        const monthMap = {
                            'มกราคม': '1', 'กุมภาพันธ์': '2', 'มีนาคม': '3', 'เมษายน': '4',
                            'พฤษภาคม': '5', 'มิถุนายน': '6', 'กรกฎาคม': '7', 'สิงหาคม': '8',
                            'กันยายน': '9', 'ตุลาคม': '10', 'พฤศจิกายน': '11', 'ธันวาคม': '12'
                        };
                        const monthNum = monthMap[month] || month;
                        // แปลงปี พ.ศ. เป็น ค.ศ. (ลบ 543)
                        const yearBE = year;
                        const yearCE = yearBE - 543;
                        // รูปแบบ: ประจำเดือน 10.25 (เดือน.ปี 2 หลักสุดท้าย)
                        const yearShort = yearCE.toString().slice(-2);
                        const periodText = `ประจำเดือน ${monthNum}.${yearShort}`;
                        summaryPeriodField.value = periodText;
                        console.log('✅ อัปเดตระยะเวลา:', periodText);
                    }
                } else if (uploadedTaxFilingFiles.length === 0) {
                    // ถ้าไม่มีไฟล์เหลืออยู่ ให้ลบข้อมูล
                    summaryPeriodField.value = '';
                }
            }
            
            // อัปเดตหัวข้อสรุป: "สรุปภาษีประจำเดือน MM/YYYY"
            const summaryTitleField = document.getElementById('summaryTitle');
            if (summaryTitleField) {
                if (ocrData) {
                    // ใช้ชื่อบริษัทจาก OCR
                    const companyName = ocrData.company_name || '';
                    const period = summaryPeriodField && summaryPeriodField.value ? summaryPeriodField.value : '';
                    
                    if (period) {
                        let monthYear = null;
                        
                        // รูปแบบใหม่: "ประจำเดือน 10/2025"
                        const periodMatchNew = period.match(/ประจำเดือน\s+(\d{1,2}\/\d{4})/i);
                        if (periodMatchNew) {
                            monthYear = periodMatchNew[1];
                        } else {
                            // รูปแบบเก่า: "ประจำเดือน 10.68" (รองรับ backward compatibility)
                            const periodMatchOld = period.match(/(\d+)\.(\d+)/);
                            if (periodMatchOld) {
                                const month = periodMatchOld[1];
                                const yearShort = periodMatchOld[2];
                            // แปลงปี 2 หลัก เป็น 4 หลัก (68 -> 2025, 25 -> 2025)
                            const yearInt = parseInt(yearShort);
                            const yearFull = yearInt >= 50 ? `19${yearShort}` : `20${yearShort}`;
                                monthYear = `${month}/${yearFull}`;
                            }
                        }
                        
                        if (monthYear) {
                            const titleText = `สรุปภาษีประจำเดือน ${monthYear}`;
                            if (!summaryTitleField.value || summaryTitleField.value.trim() === '') {
                                summaryTitleField.value = titleText;
                                console.log('✅ อัปเดตหัวข้อสรุป:', titleText);
                            }
                        }
                    }
                } else if (uploadedTaxFilingFiles.length === 0) {
                    // ถ้าไม่มีไฟล์เหลืออยู่ ให้ลบข้อมูล
                    summaryTitleField.value = '';
                }
            }
            
            // ฟังก์ชันช่วยสำหรับ parse ตัวเลขจาก JSON (รองรับรูปแบบ "28,108 38" หรือ "1,967 59")
            // สำหรับ ภ.พ.36: 2 หลักสุดท้ายจะเป็นเศษสตางค์เสมอ
            function parseAmountFromJson(value) {
                if (!value || value === null || value === undefined) return 0;
                if (typeof value === 'number') return value;
                if (typeof value !== 'string') return 0;
                
                // รูปแบบ: "28,108 38" -> แยกเป็น "28,108" (ส่วนหลัก) และ "38" (เศษสตางค์ 2 หลัก)
                // ผลลัพธ์: 28,108.38
                // รูปแบบ: "1,967 59" -> แยกเป็น "1,967" (ส่วนหลัก) และ "59" (เศษสตางค์ 2 หลัก)
                // ผลลัพธ์: 1,967.59
                
                // แยกส่วนหลักและส่วนทศนิยม (2 หลักสุดท้าย)
                const parts = value.trim().split(/\s+/);
                
                if (parts.length >= 2) {
                    // มีช่องว่างแยกส่วนหลักและส่วนทศนิยม
                    const mainPart = parts[parts.length - 2].replace(/,/g, ''); // ส่วนหลัก (ลบ comma)
                    const decimalPart = parts[parts.length - 1]; // ส่วนทศนิยม (2 หลักสุดท้าย)
                    
                    // ตรวจสอบว่า decimalPart เป็นตัวเลข 2 หลักหรือไม่
                    if (/^\d{2}$/.test(decimalPart)) {
                        const num = parseFloat(mainPart + '.' + decimalPart);
                        return isNaN(num) ? 0 : num;
                    }
                }
                
                // ถ้าไม่มีช่องว่างแยก หรือรูปแบบไม่ถูกต้อง ให้ลอง parse แบบเดิม
                const cleaned = value.replace(/,/g, '').replace(/\s+/g, '');
                const num = parseFloat(cleaned);
                return isNaN(num) ? 0 : num;
            }
            
            // ฟังก์ชันช่วยสำหรับ parse ข้อมูล ภ.พ.36 จาก JSON structure ใหม่
            function parsePP36FromNewJson(jsonData) {
                // ตรวจสอบว่ามี "data" object หรือไม่
                const dataObj = jsonData.data || jsonData;
                
                const result = {
                    taxFormType: dataObj['ภ.พ.36'] || 'ภ.พ.36',
                    companyName: dataObj['ชื่อบริษัท'] || '',
                    taxId: dataObj['เลขประจำตัวผู้เสียภาษีอากร'] || '',
                    filingType: null, // จะ parse จาก "(1) ยื่นปกติ" หรือ "(2) ยื่นเพิ่มเติมครั้งที่"
                    paymentAmount: 0, // "1. จำนวนที่จ่ายเงิน"
                    vatAmount: 0, // "2. จำนวนเงินภาษีมูลค่าเพิ่มที่ต้องนำส่ง"
                    additionalFee: 0, // "3. เงินเพิ่ม"
                    penalty: 0, // "4. เบี้ยปรับ..."
                    total: 0 // รวมทั้งหมด
                };
                
                // Parse ประเภทการยื่น - ตรวจสอบว่าอันไหนมีข้อมูล (ไม่เป็น null) แล้วดึงข้อมูลนั้นมาแสดง
                const filingTypeNormal = dataObj['(1) ยื่นปกติ'];
                const filingTypeSupplement = dataObj['(2) ยื่นเพิ่มเติมครั้งที่'];
                
                // ตรวจสอบว่าอันไหนไม่เป็น null และมีค่า
                if (filingTypeNormal !== null && filingTypeNormal !== undefined && filingTypeNormal !== '') {
                    // ถ้า "(1) ยื่นปกติ" มีข้อมูล (ไม่เป็น null) ให้ใช้ข้อมูลนี้
                    result.filingType = 'normal';
                    result.filingTypeValue = filingTypeNormal; // เก็บค่าที่ดึงมา (เช่น "ยื่นปกติ")
                } else if (filingTypeSupplement !== null && filingTypeSupplement !== undefined && filingTypeSupplement !== '') {
                    // ถ้า "(2) ยื่นเพิ่มเติมครั้งที่" มีข้อมูล (ไม่เป็น null) ให้ใช้ข้อมูลนี้
                    result.filingType = 'supplement';
                    result.filingTypeValue = filingTypeSupplement; // เก็บค่าที่ดึงมา (เช่น "1", "2", หรือข้อความอื่นๆ)
                }
                
                // Parse ยอดเงิน
                result.paymentAmount = parseAmountFromJson(dataObj['1. จำนวนที่จ่ายเงิน']);
                result.vatAmount = parseAmountFromJson(dataObj['2. จำนวนเงินภาษีมูลค่าเพิ่มที่ต้องนำส่ง']);
                result.additionalFee = parseAmountFromJson(dataObj['3. เงินเพิ่ม']);
                result.penalty = parseAmountFromJson(dataObj['4. เบี้ยปรับ (ถ้ามี (เฉพาะกรณีรับโอนสินค้าหรือรับโอนสิทธิในบริการที่ได้เสียภาษีในอัตราร้อยละ 0))']);
                
                // คำนวณรวม: VAT + Additional Fee + Penalty
                result.total = result.vatAmount + result.additionalFee + result.penalty;
                
                return result;
            }
            
            // อัปเดตข้อมูลสรุป (Input Fields)
            // สร้าง object สำหรับรวมยอดตามประเภทแบบภาษี (รวมยอดเมื่อมีหลายไฟล์)
            const taxFormAmounts = {
                'ภ.ง.ด.1': 0,
                'ภ.ง.ด.3': 0,
                'ภ.ง.ด.53': 0,
                'ภ.ง.ด.54': 0,
                'ภ.พ.36': 0,
                'ภ.พ.30': 0,
                'ประกันสังคม': 0,
                'กองทุน กยศ.': 0,
                'เบี้ยปรับ / เงินเพิ่ม': 0
            };
            
            // ฟังก์ชันตรวจสอบว่าไฟล์นี้เป็นแบบยื่นปกติหรือเพิ่มเติม
            function isSupplementFiling(ocrResult, taxFormType) {
                if (taxFormType && (taxFormType.includes('ภ.พ.36') || taxFormType.includes('ภพ.36'))) {
                    if (ocrResult.pp36_json) {
                        const dataObj = ocrResult.pp36_json.data || ocrResult.pp36_json;
                        const filingTypeSupplement = dataObj['(2) ยื่นเพิ่มเติมครั้งที่'];
                        return filingTypeSupplement !== null && filingTypeSupplement !== undefined && filingTypeSupplement !== '';
                    }
                } else if (taxFormType && taxFormType.includes('ภ.ง.ด.54')) {
                    if (ocrResult.ppnd54_json && ocrResult.ppnd54_json.data) {
                        const filingTypeSupplement = ocrResult.ppnd54_json.data['(2) ยื่นเพิ่มเติมครั้งที่'];
                        return filingTypeSupplement !== null && filingTypeSupplement !== undefined && filingTypeSupplement !== '';
                    }
                } else if (ocrResult.filing_type) {
                    return ocrResult.filing_type === 'additional' || 
                           String(ocrResult.filing_type).includes('เพิ่มเติม');
                }
                return false;
            }
            
            // ฟังก์ชันตรวจสอบว่าเดือนของไฟล์นี้ตรงกับเดือนที่พบบ่อยที่สุดหรือไม่
            function isMonthMismatch(ocrResult, taxFormType) {
                if (!monthMismatchData.hasMismatch) {
                    return false; // ไม่มีปัญหา
                }
                
                // ดึงเดือน/ปีของไฟล์นี้
                let fileMonth = null;
                let fileYear = null;
                
                if (taxFormType && taxFormType.includes('ภ.ง.ด.54')) {
                    if (ocrResult.ppnd54_json && ocrResult.ppnd54_json.data) {
                        const dateStr = ocrResult.ppnd54_json.data['3. วันเดือนปีที่จ่ายเงินได้ซึ่งต้องหักภาษีจากเงินได้ที่จ่ายตามมาตรา 70'];
                        if (dateStr) {
                            const dateMatch = String(dateStr).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                            if (dateMatch) {
                                fileMonth = parseInt(dateMatch[2]);
                                fileYear = parseInt(dateMatch[3]);
                            }
                        }
                    }
                } else if (taxFormType && (taxFormType.includes('ภ.พ.36') || taxFormType.includes('ภพ.36'))) {
                    if (ocrResult.pp36_json && ocrResult.pp36_json.data) {
                        const dateStr = ocrResult.pp36_json.data['วัน เดือน ปีที่จ่ายเงิน'];
                        if (dateStr) {
                            const dateMatch = String(dateStr).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                            if (dateMatch) {
                                fileMonth = parseInt(dateMatch[2]);
                                fileYear = parseInt(dateMatch[3]);
                            }
                        }
                    }
                } else if (taxFormType && taxFormType.includes('ประกันสังคม')) {
                    if (ocrResult.social_security_json && ocrResult.social_security_json.data) {
                        const monthNameStr = ocrResult.social_security_json.data['การนำส่งเงินสมทบสำหรับค่าจ้างเดือน'];
                        const yearStr = ocrResult.social_security_json.data['พ.ศ.'];
                        const monthMap = {
                            'มกราคม': 1, 'กุมภาพันธ์': 2, 'มีนาคม': 3, 'เมษายน': 4,
                            'พฤษภาคม': 5, 'มิถุนายน': 6, 'กรกฎาคม': 7, 'สิงหาคม': 8,
                            'กันยายน': 9, 'ตุลาคม': 10, 'พฤศจิกายน': 11, 'ธันวาคม': 12
                        };
                        if (monthNameStr) {
                            for (const [name, num] of Object.entries(monthMap)) {
                                if (String(monthNameStr).includes(name)) {
                                    fileMonth = num;
                                    break;
                                }
                            }
                        }
                        if (yearStr) {
                            const yearMatch = String(yearStr).match(/(\d{4})/);
                            if (yearMatch) {
                                fileYear = parseInt(yearMatch[1]);
                            }
                        }
                    }
                } else {
                    // สำหรับแบบอื่นๆ ใช้ month/year จาก ocrResult
                    fileMonth = ocrResult.month;
                    fileYear = ocrResult.year;
                }
                
                if (!fileMonth || !fileYear) {
                    return false; // ไม่สามารถตรวจสอบได้ ให้ผ่าน
                }
                
                // ตรวจสอบว่าเป็นแบบยื่นปกติหรือเพิ่มเติม
                const isSupplement = isSupplementFiling(ocrResult, taxFormType);
                
                if (!isSupplement && monthMismatchData.normalMismatch.length > 0) {
                    // แบบยื่นปกติ: ตรวจสอบว่าเดือนไม่ตรงกันหรือไม่
                    return monthMismatchData.normalMismatch.some(m => 
                        m.month === fileMonth && m.year === fileYear
                    );
                } else if (isSupplement && monthMismatchData.supplementMismatch.length > 0) {
                    // แบบยื่นเพิ่มเติม: ตรวจสอบว่าเดือนไม่ตรงกันหรือไม่
                    return monthMismatchData.supplementMismatch.some(m => 
                        m.month === fileMonth && m.year === fileYear
                    );
                }
                
                return false;
            }
            
            uploadedTaxFilingFiles.forEach(file => {
                if (file.ocr_result && file.ocr_result.success && file.ocr_result.amounts) {
                    const ocrResult = file.ocr_result;
                    const amounts = ocrResult.amounts || {};
                    
                    // ดึงชื่อแบบภาษีจาก OCR result หรือชื่อไฟล์
                    let taxFormType = ocrResult.tax_form_type || extractTaxFormTypeFromFilename(file.filename);
                    
                    // ตรวจสอบว่าเป็น Pay-in ภาษี หรือ Pay-in กองทุน กยศ.
                    const isPayIn = taxFormType && (taxFormType.includes('Pay-in') || taxFormType.includes('Pay-In'));
                    const isStudentLoanPayIn = taxFormType && (taxFormType.includes('กองทุน กยศ.') || taxFormType.includes('กยศ.'));
                    
                    // ข้าม Pay-in ภาษี (ไม่ต้องแสดงในตารางสรุป - ใช้สำหรับการตรวจสอบเท่านั้น)
                    // แต่ถ้าเป็น Pay-in กองทุน กยศ. ให้แสดงในตารางสรุป
                    if (isPayIn && !isStudentLoanPayIn) {
                        return; // ข้ามไฟล์ Pay-in ภาษี
                    }
                    
                    // แปลงชื่อแบบภาษีให้สั้นลง (ภงด. -> ภ.ง.ด.)
                    if (taxFormType) {
                        taxFormType = taxFormType.replace(/ภงด\./g, 'ภ.ง.ด.').replace(/ภงด/g, 'ภ.ง.ด.');
                    }
                    
                    // ตรวจสอบว่าเป็นแบบยื่นปกติหรือเพิ่มเติม
                    const isSupplement = isSupplementFiling(ocrResult, taxFormType);
                    
                    // ตรวจสอบว่าเดือนไม่ตรงกันหรือไม่ (ต้องตรวจสอบหลังจาก updateMonthSummary ถูกเรียกแล้ว)
                    // ถ้า monthMismatchData ยังไม่ถูกอัปเดต ให้ตรวจสอบเอง
                    let hasMonthMismatch = false;
                    let fileMonth = null;
                    let fileYear = null;
                    
                    if (monthMismatchData.hasMismatch) {
                        hasMonthMismatch = isMonthMismatch(ocrResult, taxFormType);
                    } else {
                        // ถ้ายังไม่มีข้อมูล mismatch ให้ตรวจสอบเอง
                        // ดึงเดือน/ปีของไฟล์นี้
                        
                        if (taxFormType && taxFormType.includes('ภ.ง.ด.54')) {
                            if (ocrResult.ppnd54_json && ocrResult.ppnd54_json.data) {
                                const dateStr = ocrResult.ppnd54_json.data['3. วันเดือนปีที่จ่ายเงินได้ซึ่งต้องหักภาษีจากเงินได้ที่จ่ายตามมาตรา 70'];
                                if (dateStr) {
                                    const dateMatch = String(dateStr).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                                    if (dateMatch) {
                                        fileMonth = parseInt(dateMatch[2]);
                                        fileYear = parseInt(dateMatch[3]);
                                    }
                                }
                            }
                        } else if (taxFormType && (taxFormType.includes('ภ.พ.36') || taxFormType.includes('ภพ.36'))) {
                            if (ocrResult.pp36_json && ocrResult.pp36_json.data) {
                                const dateStr = ocrResult.pp36_json.data['วัน เดือน ปีที่จ่ายเงิน'];
                                if (dateStr) {
                                    const dateMatch = String(dateStr).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                                    if (dateMatch) {
                                        fileMonth = parseInt(dateMatch[2]);
                                        fileYear = parseInt(dateMatch[3]);
                                    }
                                }
                            }
                        }
                        
                        // ถ้าเป็นแบบยื่นปกติ ให้ตรวจสอบกับไฟล์อื่นๆ
                        if (!isSupplement && fileMonth && fileYear) {
                            // ตรวจสอบว่ามีไฟล์อื่นที่มีเดือน/ปีต่างกันหรือไม่
                            const otherFiles = uploadedTaxFilingFiles.filter(f => 
                                f !== file && 
                                f.ocr_result && 
                                f.ocr_result.success &&
                                !isSupplementFiling(f.ocr_result, f.ocr_result.tax_form_type || extractTaxFormTypeFromFilename(f.filename))
                            );
                            
                            if (otherFiles.length > 0) {
                                // หาเดือนที่พบบ่อยที่สุด
                                const monthCounts = {};
                                const allMonths = [];
                                
                                otherFiles.forEach(f => {
                                    const otherOcr = f.ocr_result;
                                    const otherTaxFormType = otherOcr.tax_form_type || extractTaxFormTypeFromFilename(f.filename);
                                    let otherMonth = null;
                                    let otherYear = null;
                                    
                                    if (otherTaxFormType && otherTaxFormType.includes('ภ.ง.ด.54')) {
                                        if (otherOcr.ppnd54_json && otherOcr.ppnd54_json.data) {
                                            const dateStr = otherOcr.ppnd54_json.data['3. วันเดือนปีที่จ่ายเงินได้ซึ่งต้องหักภาษีจากเงินได้ที่จ่ายตามมาตรา 70'];
                                            if (dateStr) {
                                                const dateMatch = String(dateStr).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
                                                if (dateMatch) {
                                                    otherMonth = parseInt(dateMatch[2]);
                                                    otherYear = parseInt(dateMatch[3]);
                                                }
                                            }
                                        }
                                    }
                                    
                                    if (otherMonth && otherYear) {
                                        const key = `${otherMonth}_${otherYear}`;
                                        monthCounts[key] = (monthCounts[key] || 0) + 1;
                                        allMonths.push({ month: otherMonth, year: otherYear });
                                    }
                                });
                                
                                // เพิ่มเดือนของไฟล์ปัจจุบัน
                                const currentKey = `${fileMonth}_${fileYear}`;
                                monthCounts[currentKey] = (monthCounts[currentKey] || 0) + 1;
                                allMonths.push({ month: fileMonth, year: fileYear });
                                
                                // หาเดือนที่พบบ่อยที่สุด
                                if (Object.keys(monthCounts).length > 1) {
                                    const mostCommonMonth = Object.keys(monthCounts).reduce((a, b) => 
                                        monthCounts[a] > monthCounts[b] ? a : b
                                    );
                                    const [commonMonth, commonYear] = mostCommonMonth.split('_').map(Number);
                                    
                                    // ตรวจสอบว่าเดือนของไฟล์นี้ไม่ตรงกับเดือนที่พบบ่อยที่สุดหรือไม่
                                    if (fileMonth !== commonMonth || fileYear !== commonYear) {
                                        hasMonthMismatch = true;
                                    }
                                }
                            }
                        }
                    }
                    
                    // ถ้าเป็นแบบยื่นปกติและเดือนไม่ตรงกัน ให้ข้าม (ไม่รวมยอด)
                    if (!isSupplement && hasMonthMismatch) {
                        console.warn(`⚠️ ข้ามไฟล์ ${file.filename} เพราะเดือนไม่ตรงกัน (แบบยื่นปกติ) - เดือน: ${fileMonth}, ปี: ${fileYear}`);
                        return; // ข้ามไฟล์นี้
                    }
                    
                    // ถ้าเป็นแบบยื่นเพิ่มเติมและเดือนไม่ตรงกัน ให้ตรวจสอบว่าผู้ใช้ยืนยันแล้วหรือยัง
                    if (isSupplement && hasMonthMismatch) {
                        // ตรวจสอบว่ามี flag ที่บอกว่าผู้ใช้ยืนยันแล้วหรือยัง
                        if (!window.supplementMismatchConfirmed) {
                            // ถ้ายังไม่ยืนยัน ให้แสดง popup และข้ามไฟล์นี้
                            // ใช้ confirm แบบเดิมก่อน (เพราะ async/await อาจซับซ้อน)
                            const monthMap = {
                                'มกราคม': 1, 'กุมภาพันธ์': 2, 'มีนาคม': 3, 'เมษายน': 4,
                                'พฤษภาคม': 5, 'มิถุนายน': 6, 'กรกฎาคม': 7, 'สิงหาคม': 8,
                                'กันยายน': 9, 'ตุลาคม': 10, 'พฤศจิกายน': 11, 'ธันวาคม': 12
                            };
                            
                            const mismatchedDetails = monthMismatchData.supplementMismatch.map(m => {
                                const monthName = Object.keys(monthMap).find(k => monthMap[k] === m.month);

        function resetProgressSteps() {

                const status = step.querySelector('.step-status');
                
                // รีเซ็ตเป็นสถานะรอ

        function updateProgressStep(stepNumber, status, message = '') {
            const step = document.querySelector(`.progress-step[data-step="${stepNumber}"]`);
            if (!step) return;
            
            const icon = step.querySelector('.step-icon');
            const statusElement = step.querySelector('.step-status');
            
            if (status === 'loading') {
                icon.textContent = '⏳';
                icon.style.background = '#3b82f6';
                statusElement.textContent = message || 'กำลังดำเนินการ...';
                statusElement.style.color = '#60a5fa';
                step.style.borderLeftColor = '#3b82f6';
            } else if (status === 'success') {
                icon.textContent = '✅';
                icon.style.background = '#10b981';
                statusElement.textContent = message || 'เสร็จสิ้น';
                statusElement.style.color = '#34d399';
                step.style.borderLeftColor = '#10b981';
            } else if (status === 'error') {
                icon.textContent = '❌';
                icon.style.background = '#ef4444';
                statusElement.textContent = message || 'เกิดข้อผิดพลาด';
                statusElement.style.color = '#f87171';
                step.style.borderLeftColor = '#ef4444';
            }
        }
        
        function updateOverallProgress(percentage) {
            const progressBar = document.getElementById('overallProgressBar');
            const progressText = document.getElementById('overallProgressText');
            
            if (progressBar) {
                progressBar.style.width = percentage + '%';
            }
            if (progressText) {
                progressText.textContent = Math.round(percentage) + '%';
            }
        }
        
        // ฟังก์ชันสร้างรายการแบบภาษีจาก OCR
        function generateTaxFormsListFromOCR() {
            const taxForms = new Set(); // ใช้ Set เพื่อไม่ให้ซ้ำ
            
            // ดึงข้อมูลจากไฟล์ที่อัปโหลด
            uploadedTaxFilingFiles.forEach(file => {
                if (file.ocr_result && file.ocr_result.success) {
                    const taxFormType = file.ocr_result.tax_form_type || '';
                    
                    // แมป tax_form_type กับรายการแบบภาษี
                    if (taxFormType.includes('ภ.ง.ด.1') || taxFormType.includes('PND1')) {
                        // ตรวจสอบว่ามีคำว่า "สำหรับใบเสร็จรับเงิน" ใน raw_text หรือไม่
                        const rawText = file.ocr_result.raw_text || '';
                        const hasReceiptText = rawText.includes('สำหรับใบเสร็จรับเงิน');
                        
                        if (hasReceiptText) {
                            // ถ้ามีคำว่า "สำหรับใบเสร็จรับเงิน" ให้เพิ่มทั้งสองรายการ
                            taxForms.add('- แบบและใบแนบ ภ.ง.ด. 1');
                            taxForms.add('- ใบเสร็จรับเงินแบบ ภ.ง.ด.1');
                        } else {
                            // ถ้าไม่มี ให้เพิ่มแค่รายการเดียว
                            taxForms.add('- แบบและใบแนบ ภ.ง.ด. 1');
                        }
                    }
                    if (taxFormType.includes('ภ.ง.ด.3') || taxFormType.includes('PND3')) {
                        taxForms.add('- แบบ ใบแนบ และใบหัก ณ ที่จ่าย ภ.ง.ด. 3');
                    }
                    if (taxFormType.includes('ภ.ง.ด.53') || taxFormType.includes('PND53')) {
                        taxForms.add('- แบบ ใบแนบ และใบหัก ณ ที่จ่าย ภ.ง.ด. 53');
                    }
                    if (taxFormType.includes('ภ.ง.ด.54') || taxFormType.includes('PND54')) {
                        taxForms.add('- แบบ ภ.ง.ด. 54');
                    }
                    if (taxFormType.includes('ภ.พ.30') || taxFormType.includes('PP30')) {
                        taxForms.add('- แบบ ภ.พ.30');
                        taxForms.add('- รายงานภาษีซื้อ และ ภาษีขาย');
                    }
                    if (taxFormType.includes('ภ.พ.36') || taxFormType.includes('PP36')) {
                        taxForms.add('- แบบ ภ.พ. 36');
                    }
                    if (taxFormType.includes('ประกันสังคม') || taxFormType.includes('Social Security')) {
                        taxForms.add('- แบบและใบแนบ ประกันสังคม');
                    }
                    if (taxFormType.includes('กองทุน กยศ') || taxFormType.includes('Student Loan')) {
                        taxForms.add('- ใบชำระเงิน (Pay-in) กองทุน กยศ.');
                    }
                    if (taxFormType.includes('Pay-in') && !taxFormType.includes('กองทุน กยศ')) {
                        taxForms.add('- ใบชำระเงิน (Pay-in) ภาษี');
                    }
                }
            });
            
            // เพิ่มจากไฟล์แนบด้วย
            uploadedTaxAttachmentFiles.forEach(file => {
                if (file.ocr_result && file.ocr_result.success) {
                    const taxFormType = file.ocr_result.tax_form_type || '';
                    
                    if (taxFormType.includes('Pay-in') && !taxFormType.includes('กองทุน กยศ')) {
                        taxForms.add('- ใบชำระเงิน (Pay-in) ภาษี');
                    }
                    if (taxFormType.includes('กองทุน กยศ') || taxFormType.includes('Student Loan')) {
                        taxForms.add('- ใบชำระเงิน (Pay-in) กองทุน กยศ.');
                    }
                }
            });
            
            // เพิ่มรายการ "สรุปภาษี ประจำเดือน" เสมอ
            taxForms.add('- สรุปภาษี ประจำเดือน');
            
            // แปลง Set เป็น Array แล้วเรียงลำดับ
            const formsArray = Array.from(taxForms);
            const orderedForms = [];
            
            // เรียงลำดับตามที่ต้องการ
            const order = [
                '- แบบและใบแนบ ภ.ง.ด. 1',
                '- ใบเสร็จรับเงินแบบ ภ.ง.ด.1',
                '- แบบ ใบแนบ และใบหัก ณ ที่จ่าย ภ.ง.ด. 3',
                '- แบบ ใบแนบ และใบหัก ณ ที่จ่าย ภ.ง.ด. 53',
                '- แบบ ภ.ง.ด. 54',
                '- แบบ ภ.พ.30',
                '- รายงานภาษีซื้อ และ ภาษีขาย',
                '- แบบ ภ.พ. 36',
                '- แบบและใบแนบ ประกันสังคม',
                '- ใบชำระเงิน (Pay-in) กองทุน กยศ.',
                '- ใบชำระเงิน (Pay-in) ภาษี',
                '- สรุปภาษี ประจำเดือน'
            ];
            
            order.forEach(item => {
                if (formsArray.includes(item)) {
                    orderedForms.push(item);
                }
            });
            
            // ถ้าไม่มีรายการใดๆ เลย ให้ return ข้อความรอ
            if (orderedForms.length === 0) {
                return '(รอการอัปโหลดเอกสาร)';
            }
            
            return orderedForms.join('\n');
        }

        // ฟังก์ชันอัปเดต Subject และ Body จากข้อมูล OCR
        function updateEmailContentFromOCR() {
            const subjectField = document.getElementById('emailSubject');
            const bodyField = document.getElementById('emailBody');
            
            if (!subjectField || !bodyField) return;
            
            let subject = subjectField.value;
            let body = bodyField.value;
            
            // Debug: ตรวจสอบว่า Subject มี {company_name} หรือไม่
            console.log('🔍 [updateEmailContentFromOCR] Subject ก่อนอัปเดต:', subject);
            console.log('🔍 [updateEmailContentFromOCR] Subject มี {company_name}:', subject.includes('{company_name}'));
            
            // แทนที่ {TAX_FORMS_LIST} ด้วยรายการจริง
            if (body.includes('{TAX_FORMS_LIST}')) {
                const taxFormsList = generateTaxFormsListFromOCR();
                body = body.replace('{TAX_FORMS_LIST}', taxFormsList);
                console.log('✅ แทนที่รายการแบบภาษีจาก OCR (placeholder)');
            }
            
            // แทนที่รายการแบบภาษีทั้งหมด (หลายบรรทัดที่ขึ้นต้นด้วย "-")
            // หาบล็อกรายการระหว่าง "ขออนุญาตส่งเอกสาร" และ "ยอดที่ต้องชำระ"
            const taxFormsListPattern = /(ขออนุญาตส่งเอกสารประกอบการยื่นแบบภาษีประจำเดือน[^\n]*\n)((?:^- .+$\n?)+)(\n*ยอดที่ต้องชำระ)/gm;
            
            if (taxFormsListPattern.test(body)) {
                const taxFormsList = generateTaxFormsListFromOCR();
                body = body.replace(taxFormsListPattern, (match, prefix, oldList, suffix) => {
                    console.log('✅ แทนที่รายการแบบภาษีจาก OCR (บล็อกทั้งหมด)');
                    return prefix + taxFormsList + suffix;
                });
            } else if (body.includes('- สรุปภาษี ประจำเดือน') || body.includes('- แบบ ภ.พ.30')) {
                // ถ้าไม่พบ pattern ข้างบน ให้ลองแทนที่แบบเก่า

                body = body.replace(/((?:^- .+$\n?)+)/m, taxFormsList + '\n');

            let monthYear = '';
            
            const monthMap = {
