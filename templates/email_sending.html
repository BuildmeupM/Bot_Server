<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotV3 - ส่งอีเมลล์</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0e1117;
            color: #fafafa;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            background: linear-gradient(90deg, #3498db 0%, #2980b9 100%);
            padding: 20px;
            border-radius: 10px;
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .nav-bar {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }
        
        .nav-link {
            padding: 10px 20px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        
        .nav-link:hover {
            background: #475569;
        }
        
        .nav-link.active {
            background: #3498db;
        }
        
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        
        .panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }
        
        .panel h2 {
            color: #fbbf24;
            margin-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #475569;
            border-radius: 5px;
            background: #0f172a;
            color: #fafafa;
            font-size: 14px;
            font-family: inherit;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .btn-full {
            width: 100%;
        }
        
        .status-box {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .status-success {
            background: #1e3a1e;
            border-left: 4px solid #27ae60;
        }
        
        .status-warning {
            background: #3a2e1e;
            border-left: 4px solid #f39c12;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #334155;
        }
        
        /* Animation for validation banner */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .tab {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        
        .tab.active {
            color: #60a5fa;
            border-bottom-color: #60a5fa;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .log-container {
            background: #0f172a;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            max-height: 400px;
            overflow-y: auto;
            font-size: 12px;
        }
        
        .log-entry {
            margin-bottom: 5px;
        }
        
        .log-success { color: #27ae60; }
        .log-error { color: #e74c3c; }
        .log-warning { color: #f39c12; }
        .log-info { color: #00aaff; }
        
        .drag-over {
            border-color: #60a5fa !important;
            background: #1e3a5f !important;
            transform: scale(1.02);
        }
        
        .tax-form-checked {
            background: #1e3a1e !important;
            border-left: 3px solid #27ae60 !important;
        }
        
        .tax-form-checked span:first-child {
            color: #27ae60 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 BotV3 - ระบบส่งอีเมลล์อัตโนมัติ</h1>
        </div>
        
        <div class="nav-bar">
            <a href="/" class="nav-link">🏠 หน้าหลัก</a>
            <a href="/pdf" class="nav-link">🤖 ประมวลผล PDF</a>
            <a href="/email" class="nav-link active">📧 ส่งอีเมลล์</a>
            <a href="/document-sorting" class="nav-link">📋 คัดแยกเอกสาร</a>
            <a href="/auditcheck" class="nav-link">🔍 ตรวจภาษี</a>
        </div>
        
        <div class="content-grid">
            <div class="panel">
                <h2>⚙️ ตั้งค่า SMTP</h2>
                <form id="smtpForm">
                    <div class="form-group">
                        <label>SMTP Server</label>
                        <input type="text" id="smtpServer" value="smtppro.zoho.com" placeholder="smtp.gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>SMTP Port</label>
                        <input type="number" id="smtpPort" value="587" min="1" max="65535" required onchange="updateTLSSetting()">
                        <small style="color: #94a3b8;">Port 587 = TLS, Port 465 = SSL (จะตั้งค่าอัตโนมัติ)</small>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="smtpUseTLS" checked> ใช้ TLS
                        </label>
                        <small style="color: #94a3b8; display: block; margin-top: 5px;" id="tlsHint">สำหรับ Port 587 (Port 465 จะใช้ SSL อัตโนมัติ)</small>
                    </div>
                    <div class="form-group">
                        <label>อีเมลล์ผู้ส่ง (Username)</label>
                        <input type="email" id="smtpUsername" placeholder="your-email@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>รหัสผ่าน (Password)</label>
                        <input type="password" id="smtpPassword" placeholder="รหัสผ่านหรือ App Password" required>
                    </div>
                    <div class="form-group">
                        <label>อีเมลล์ผู้ส่ง (From)</label>
                        <input type="email" id="emailFrom" placeholder="your-email@gmail.com">
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">💾 บันทึกการตั้งค่า</button>
                </form>
                
                <div id="smtpStatus" style="margin-top: 20px;"></div>
            </div>
            
            <div class="panel">
                <div id="emailContent">
                    <div class="status-box status-warning">
                        <p>⚠️ กรุณาตั้งค่า SMTP ในแถบด้านซ้ายก่อนใช้งาน</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let smtpConfigured = false;
        
        function updateTLSSetting() {
            const port = parseInt(document.getElementById('smtpPort').value);
            const tlsCheckbox = document.getElementById('smtpUseTLS');
            const tlsHint = document.getElementById('tlsHint');
            
            if (port === 465) {
                // Port 465 → ใช้ SSL (ล็อคไว้)
                tlsCheckbox.checked = false;
                tlsCheckbox.disabled = true;
                tlsHint.textContent = 'Port 465 ใช้ SSL (ล็อคการตั้งค่า - จะตั้งค่าอัตโนมัติ)';
                tlsHint.style.color = '#60a5fa';
            } else if (port === 587) {
                // Port 587 → ใช้ TLS (ล็อคไว้)
                tlsCheckbox.checked = true;
                tlsCheckbox.disabled = true;
                tlsHint.textContent = 'Port 587 ใช้ TLS (ล็อคการตั้งค่า - จะตั้งค่าอัตโนมัติ)';
                tlsHint.style.color = '#60a5fa';
            } else {
                // Port อื่นๆ → ให้ผู้ใช้เลือกเอง
                tlsCheckbox.disabled = false;
                tlsHint.textContent = 'สำหรับ Port อื่นๆ (Port 587 = TLS, Port 465 = SSL)';
                tlsHint.style.color = '#94a3b8';
            }
        }
        
        // เรียกใช้เมื่อโหลดหน้า
        document.addEventListener('DOMContentLoaded', function() {
            updateTLSSetting();
            
            // เพิ่ม event listener สำหรับ SMTP form
            const smtpForm = document.getElementById('smtpForm');
            if (smtpForm) {
                smtpForm.addEventListener('submit', saveSMTPConfig);
            }
            
            // โหลด patterns และ signatures เมื่อเปิดหน้า
            loadPatterns();
            loadPatternsList();
            loadSignatures();
            loadSignaturesList();
        });
        
        function validateSMTPConfig() {
            const smtpServer = document.getElementById('smtpServer').value.trim();
            const smtpPort = document.getElementById('smtpPort').value;
            const smtpUsername = document.getElementById('smtpUsername').value.trim();
            const smtpPassword = document.getElementById('smtpPassword').value;
            
            // ตรวจสอบข้อมูลที่จำเป็น
            if (!smtpServer) {
                return { valid: false, message: 'กรุณาระบุ SMTP Server' };
            }
            
            if (!smtpUsername) {
                return { valid: false, message: 'กรุณาระบุอีเมลล์ผู้ส่ง (Username)' };
            }
            
            if (!smtpPassword) {
                return { valid: false, message: 'กรุณาระบุรหัสผ่าน' };
            }
            
            // ตรวจสอบรูปแบบ SMTP Server
            const commonSMTP = {
                'gmail.com': 'smtp.gmail.com',
                'outlook.com': 'smtp-mail.outlook.com',
                'hotmail.com': 'smtp-mail.outlook.com',
                'yahoo.com': 'smtp.mail.yahoo.com'
            };
            
            // ตรวจสอบการสะกดที่พบบ่อย
            const commonTypos = {
                'stmp.gmail.com': 'smtp.gmail.com',
                'smtp.gmai.com': 'smtp.gmail.com',
                'smtp.gmail.co': 'smtp.gmail.com',
                'stmp.outlook.com': 'smtp-mail.outlook.com',
            };
            
            const serverLower = smtpServer.toLowerCase();
            if (commonTypos[serverLower]) {
                return { 
                    valid: false, 
                    message: `SMTP Server อาจสะกดผิด: "${smtpServer}" → ควรเป็น "${commonTypos[serverLower]}"` 
                };
            }
            
            // ตรวจสอบรูปแบบพื้นฐาน
            if (!/^[a-zA-Z0-9]([a-zA-Z0-9\-\.]{0,61}[a-zA-Z0-9])?$/.test(smtpServer.replace(/\./g, ''))) {
                return { valid: false, message: `รูปแบบ SMTP Server ไม่ถูกต้อง: ${smtpServer}` };
            }
            
            // ตรวจสอบ port
            const port = parseInt(smtpPort);
            if (isNaN(port) || port < 1 || port > 65535) {
                return { valid: false, message: 'Port ต้องอยู่ระหว่าง 1-65535' };
            }
            
            return { valid: true, message: '' };
        }
        
        function saveSMTPConfig(event) {
            event.preventDefault();
            
            // ตรวจสอบข้อมูลก่อนส่ง
            const validation = validateSMTPConfig();
            if (!validation.valid) {
                document.getElementById('smtpStatus').innerHTML = `
                    <div class="status-box status-warning">
                        <p>⚠️ ${validation.message}</p>
                    </div>
                `;
                return;
            }
            
            const config = {
                smtp_server: document.getElementById('smtpServer').value.trim(),
                smtp_port: parseInt(document.getElementById('smtpPort').value),
                smtp_use_tls: document.getElementById('smtpUseTLS').checked,
                smtp_username: document.getElementById('smtpUsername').value.trim(),
                smtp_password: document.getElementById('smtpPassword').value,
                email_from: document.getElementById('emailFrom').value.trim() || document.getElementById('smtpUsername').value.trim()
            };
            
            // แสดงสถานะกำลังเชื่อมต่อ
            document.getElementById('smtpStatus').innerHTML = `
                <div class="status-box status-warning">
                    <p>⏳ กำลังทดสอบการเชื่อมต่อ...</p>
                </div>
            `;
            
            fetch('/api/email/config', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(config)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    smtpConfigured = true;
                    document.getElementById('smtpStatus').innerHTML = `
                        <div class="status-box status-success">
                            <p>✅ ${data.message}</p>
                        </div>
                    `;
                    showEmailForm();
                    loadPatterns();
                } else {
                    document.getElementById('smtpStatus').innerHTML = `
                        <div class="status-box status-warning">
                            <p>❌ ${data.message}</p>
                            <p style="margin-top: 10px; font-size: 12px; color: #cbd5e1;">
                                💡 <strong>คำแนะนำ:</strong><br>
                                • ตรวจสอบการสะกด SMTP Server (ตัวอย่าง: smtp.gmail.com, smtppro.zoho.com)<br>
                                • ตรวจสอบ Port (587 สำหรับ TLS, 465 สำหรับ SSL - ตั้งค่าอัตโนมัติ)<br>
                                • ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต<br>
                                • <strong>สำหรับ Zoho:</strong> ใช้รหัสผ่านที่ถูกต้อง หรือ App Password (ถ้าเปิด 2FA)<br>
                                • <strong>สำหรับ Gmail:</strong> ต้องใช้ App Password แทนรหัสผ่านปกติ
                            </p>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('smtpStatus').innerHTML = `
                    <div class="status-box status-warning">
                        <p>❌ เกิดข้อผิดพลาดในการเชื่อมต่อ: ${error}</p>
                    </div>
                `;
            });
        }
        
        function showEmailForm() {
            document.getElementById('emailContent').innerHTML = `
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('single')">📧 ส่งอีเมลล์</button>
                    <button class="tab" onclick="switchTab('bulk')">📋 ส่งหลายฉบับ</button>
                    <button class="tab" onclick="switchTab('patterns')">📝 แพทเทิร์น</button>
                    <button class="tab" onclick="switchTab('signatures')">✍️ ลายเซ็นต์</button>
                    <button class="tab" onclick="switchTab('history')">📊 ประวัติ</button>
                </div>
                
                <div id="singleTab" class="tab-content active">
                    <h2>📧 ส่งอีเมลล์เดี่ยว</h2>
                    
                    <!-- Validation Banner -->
                    <div id="validationBanner" style="display: none; margin-bottom: 20px; padding: 15px; border-radius: 8px; border-left: 4px solid; animation: slideDown 0.3s ease;">
                        <div style="display: flex; align-items: start; gap: 12px;">
                            <span id="validationIcon" style="font-size: 24px; flex-shrink: 0;"></span>
                            <div style="flex: 1;">
                                <div id="validationTitle" style="font-weight: bold; font-size: 16px; margin-bottom: 8px;"></div>
                                <div id="validationMessage" style="font-size: 14px; line-height: 1.6;"></div>
                                <div id="validationActions" style="margin-top: 12px; display: flex; gap: 10px;"></div>
                            </div>
                            <button onclick="closeValidationBanner()" style="background: none; border: none; color: inherit; cursor: pointer; font-size: 20px; padding: 0; line-height: 1; flex-shrink: 0;">&times;</button>
                        </div>
                    </div>
                    
                    <form onsubmit="event.preventDefault(); return false;">
                        <div class="form-group">
                            <label>เลือก Template อีเมลล์</label>
                            <select id="emailTemplate" onchange="loadEmailTemplate()" style="width: 100%; padding: 10px; border: 1px solid #475569; border-radius: 5px; background: #0f172a; color: #fafafa;">
                                <option value="">-- เลือก Template --</option>
                                <option value="template1">1. ยื่นแบบมีหัก ณ ที่จ่ายและภาษีมูลค่าเพิ่ม</option>
                                <option value="template2">2. ยื่นแบบมีหัก ณ ที่จ่าย</option>
                                <option value="template3">3. ยื่นแบบภาษีมูลค่าเพิ่ม</option>
                            </select>
                            <small style="color: #94a3b8;">เลือก template เพื่อเติมหัวข้อและเนื้อหาอีเมลล์อัตโนมัติ</small>
                        </div>
                        <div class="form-group" style="position: relative;">
                            <label>ใช้แพทเทิร์น (Pattern)</label>
                            <input type="text" id="emailPattern" placeholder="พิมพ์เพื่อค้นหา pattern..." autocomplete="off" oninput="handlePatternChange()" onfocus="showPatternSuggestions()" onblur="handlePatternBlur()" style="width: 100%; padding: 10px; border: 1px solid #475569; border-radius: 5px; background: #0f172a; color: #fafafa;">
                            <div id="patternSuggestions" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: #0f172a; border: 1px solid #475569; border-top: none; border-radius: 0 0 5px 5px; max-height: 200px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);"></div>
                            <small style="color: #94a3b8;">พิมพ์เพื่อค้นหา pattern หรือเลือกจากรายการ (ถ้าไม่ระบุ ระบบจะตรวจสอบจาก Tax ID อัตโนมัติ)</small>
                        </div>
                        <div class="form-group">
                            <label>อีเมลล์ผู้รับ (To) *</label>
                            <textarea id="toEmails" placeholder="email1@example.com&#10;email2@example.com"></textarea>
                            <small style="color: #94a3b8;">ถ้าไม่ระบุจะใช้เมลล์เริ่มต้นจาก config</small>
                        </div>
                        <div class="form-group">
                            <label>อีเมลล์ CC</label>
                            <textarea id="ccEmails" placeholder="cc1@example.com&#10;cc2@example.com"></textarea>
                            <small style="color: #94a3b8;">จะรวมกับ CC เริ่มต้นจาก config</small>
                        </div>
                        <div class="form-group">
                            <label>หัวข้ออีเมลล์ (Subject) *</label>
                            <input type="text" id="emailSubject" placeholder="หัวข้ออีเมลล์" required>
                        </div>
                        <div class="form-group">
                            <label>เนื้อหาอีเมลล์ *</label>
                            <textarea id="emailBody" placeholder="เนื้อหาอีเมลล์..." rows="10" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>ลายเซ็นต์ (Signature) *</label>
                            <select id="emailSignature" required style="width: 100%; padding: 10px; border: 1px solid #475569; border-radius: 5px; background: #0f172a; color: #fafafa;">
                                <option value="">-- กรุณาเลือกลายเซ็นต์ --</option>
                            </select>
                            <small style="color: #fbbf24;">⚠️ บังคับเลือกลายเซ็นต์ก่อนส่งอีเมลล์ (จัดการลายเซ็นต์ได้ที่แท็บ "ลายเซ็นต์")</small>
                        </div>
                        <div class="form-group">
                            <label>ไฟล์แนบ (Attachments)</label>
                            
                            <!-- รายการแบบภาษีที่อัปโหลดแล้ว -->
                            <div style="background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #475569; margin-bottom: 15px;">
                                <label style="color: #fbbf24; font-weight: bold; margin-bottom: 10px; display: block;">
                                    📊 รายการแบบภาษีที่อัปโหลดแล้ว
                                </label>
                                <!-- แจ้งเตือนเมื่อแบบภาษีไม่ตรงกับ Template -->
                                <div id="templateValidationAlert" style="display: none; margin-bottom: 10px; padding: 12px; background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%); border-radius: 8px; border: 1px solid #dc2626;">
                                    <div style="display: flex; align-items: flex-start; gap: 10px;">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #fca5a5; flex-shrink: 0; margin-top: 2px;">
                                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                                            <line x1="12" y1="9" x2="12" y2="13"></line>
                                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                                        </svg>
                                        <div style="flex: 1;">
                                            <div style="color: #fca5a5; font-weight: bold; font-size: 14px; margin-bottom: 5px;">⚠️ การแนบไฟล์ไม่ถูกต้อง</div>
                                            <div id="templateValidationMessage" style="color: #fee2e2; font-size: 13px; line-height: 1.5;"></div>
                                        </div>
                                    </div>
                                </div>
                                <div id="taxFormChecklist" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px;">

        // ฟังก์ชันโหลดประวัติการส่งอีเมล
        async function loadEmailHistory() {
            try {
                const response = await fetch('/api/email/history');
                const data = await response.json();
                
                const logsContainer = document.getElementById('emailLogs');
                if (!logsContainer) return;
                
                if (!data.success || !data.history || data.history.length === 0) {
                    logsContainer.innerHTML = '<div class="log-entry log-info">[ระบบ] ยังไม่มีประวัติการส่ง</div>';
                    return;
                }
                
                // แสดงประวัติ
                let html = '';
                data.history.forEach((entry, index) => {
                    const sentTime = entry.sent_time || 'ไม่ระบุ';
                    const patternName = entry.pattern_name || '<span style="color: #94a3b8;">ไม่ใช้ Pattern</span>';
                    const signatureName = entry.signature_name || '<span style="color: #94a3b8;">ไม่ใช้ Signature</span>';
                    
                    html += `
                        <div class="log-entry log-success" style="margin-bottom: 10px; padding: 15px; border-left: 4px solid #10b981;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <strong style="color: #10b981;">📧 การส่งครั้งที่ ${data.history.length - index}</strong>
                                <span style="color: #94a3b8; font-size: 0.9em;">${sentTime}</span>
                            </div>
                            <div style="margin-top: 8px;">
                                <div><strong>Pattern:</strong> ${patternName}</div>
                                <div style="margin-top: 5px;"><strong>Signature:</strong> ${signatureName}</div>
                            </div>
                        </div>
                    `;
                });
                
                logsContainer.innerHTML = html;
            } catch (error) {
                console.error('Error loading email history:', error);

                if (logsContainer) {
                    logsContainer.innerHTML = '<div class="log-entry log-error">[ข้อผิดพลาด] ไม่สามารถโหลดประวัติได้</div>';

        function handleDragOver(event) {

            event.currentTarget.classList.add('drag-over');

        function handleDragLeave(event) {

        // ฟังก์ชันสำหรับการอัปโหลดไฟล์แบบรวม
        function handleFileDrop(event) {
            event.preventDefault();
            event.stopPropagation();
            event.currentTarget.classList.remove('drag-over');
            
            // ตรวจสอบว่ามีไฟล์กำลังประมวลผล OCR หรือไม่
            if (hasOCRProcessingFiles()) {
                alert('⚠️ ระบบกำลังประมวลผล OCR อยู่ กรุณารอจนกว่าจะเสร็จสิ้นก่อนอัปโหลดไฟล์ใหม่');
                return;
            }
            
            const files = event.dataTransfer.files;
            if (files.length > 0) {
                const dataTransfer = new DataTransfer();
                Array.from(files).forEach(file => {
                    dataTransfer.items.add(file);
                });
                
                document.getElementById('uploadFiles').files = dataTransfer.files;
                handleFileSelect({ target: document.getElementById('uploadFiles') });
            }
        }
        
        // ตัวแปรป้องกันการเรียกซ้ำ
        let isProcessingFile = false;
        let ocrProcessingFiles = new Set(); // เก็บรายการไฟล์ที่กำลังประมวลผล OCR
        
        // ฟังก์ชันตรวจสอบว่ามีไฟล์กำลังประมวลผล OCR หรือไม่
        function hasOCRProcessingFiles() {
            // ตรวจสอบจาก ocrProcessingFiles Set เป็นหลัก (เร็วกว่าและแม่นยำกว่า)
            if (ocrProcessingFiles.size > 0) {
                return true;
            }
            
            // ตรวจสอบจาก loading items ที่มีคำว่า "OCR" หรือ "ประมวลผล" (fallback)
            const fileList = document.getElementById('fileList');
            const taxFilingList = document.getElementById('taxFilingList');
            
            if (fileList) {
                const loadingItems = fileList.querySelectorAll('[id^="loading-"]');
                for (let item of loadingItems) {
                    if (item.textContent.includes('OCR') || item.textContent.includes('ประมวลผล')) {
                        return true;
                    }
                }
            }
            
            if (taxFilingList) {
                const loadingItems = taxFilingList.querySelectorAll('[id^="loading-"]');
                for (let item of loadingItems) {
                    if (item.textContent.includes('OCR') || item.textContent.includes('ประมวลผล')) {
                        return true;
                    }
                }
            }
            
            return false;
        }
        
        // ฟังก์ชันแสดง/ซ่อนหน้าต่างกำลังโหลด OCR
        function updateOCRLoadingModal() {
            const modal = document.getElementById('ocrLoadingModal');
            const statusText = document.getElementById('ocrLoadingStatus');
            const fileText = document.getElementById('ocrLoadingFile');
            const progressBar = document.getElementById('ocrLoadingProgress');
            const fileDropZone = document.getElementById('fileDropZone');
            const uploadFilesInput = document.getElementById('uploadFiles');
            const taxFilingInput = document.getElementById('taxFilingInput');
            
            if (!modal || !statusText) return;
            
            const hasProcessing = hasOCRProcessingFiles();
            
            if (hasProcessing) {
                // แสดง modal และปิดการใช้งานการอัปโหลด
                modal.style.display = 'block';
                
                // นับจำนวนไฟล์ที่กำลังประมวลผล
                const processingCount = ocrProcessingFiles.size;
                if (processingCount > 0) {
                    statusText.textContent = `กำลังประมวลผล OCR ${processingCount} ไฟล์...`;
                    
                    // แสดงชื่อไฟล์ที่กำลังประมวลผล (ถ้ามี)
                    const fileNames = Array.from(ocrProcessingFiles).slice(0, 3);
                    if (fileNames.length > 0) {
                        fileText.textContent = fileNames.join(', ') + (processingCount > 3 ? ` และอีก ${processingCount - 3} ไฟล์` : '');
                    }
                    
                    // อัปเดต progress bar (ประมาณการ)
                    const progress = Math.min(50 + (processingCount * 10), 90); // ไม่แสดง 100% จนกว่าจะเสร็จจริง
                    progressBar.style.width = progress + '%';
                } else {
                    statusText.textContent = 'กำลังประมวลผล OCR...';
                    fileText.textContent = '';
                    progressBar.style.width = '50%';
                }
                
                // ปิดการใช้งานการอัปโหลด
                if (fileDropZone) {
                    fileDropZone.style.opacity = '0.5';
                    fileDropZone.style.pointerEvents = 'none';
                    fileDropZone.style.cursor = 'not-allowed';
                }
                if (uploadFilesInput) {
                    uploadFilesInput.disabled = true;
                }
                if (taxFilingInput) {
                    taxFilingInput.disabled = true;
                }
            } else {
                // ซ่อน modal และเปิดการใช้งานการอัปโหลด
                modal.style.display = 'none';
                
                if (fileDropZone) {
                    fileDropZone.style.opacity = '1';
                    fileDropZone.style.pointerEvents = 'auto';
                    fileDropZone.style.cursor = 'pointer';
                }
                if (uploadFilesInput) {
                    uploadFilesInput.disabled = false;
                }
                if (taxFilingInput) {
                    taxFilingInput.disabled = false;
                }
            }
        }
        
        // ฟังก์ชันตรวจสอบประเภทไฟล์จากชื่อไฟล์
        // เงื่อนไข: ต้องตรวจสอบข้อ 1 ก่อน (คำว่า "แบบ", "Pay-in", "PAY-IN")
        // แล้วจึงตรวจสอบข้อ 2 (คำว่า "ภ.พ.30" หรือ "ภ.พ. 30")
        function detectFileTypeFromFilename(filename) {
            const filenameLower = filename.toLowerCase();
            const filenameOriginal = filename; // เก็บชื่อไฟล์ต้นฉบับไว้สำหรับตรวจสอบ (case-sensitive)
            
            // ข้อ 1: ตรวจสอบว่ามีคำว่า "แบบ", "Pay-in", "PAY-IN", "ประกันสังคม", หรือ "กยศ" หรือไม่
            const hasKeyword1 = filenameLower.includes('แบบ') || 
                               filenameLower.includes('pay-in') || 
                               filename.includes('PAY-IN') ||
                               filenameLower.includes('ประกันสังคม') ||
                               filenameLower.includes('กยศ');
            
            if (!hasKeyword1) {
                // ถ้าไม่มีคำสำคัญข้อ 1 → เป็นไฟล์แนบทั่วไป (ไม่ทำ OCR)
                console.log(`ℹ️ [File Detection] ไม่พบคำสำคัญ "แบบ", "Pay-in", "PAY-IN", "ประกันสังคม", หรือ "กยศ" → ไฟล์แนบทั่วไป: ${filename}`);
                return 'tax_attachment';
            }
            
            // ผ่านข้อ 1 แล้ว → ต้องทำ OCR
            console.log(`✅ [File Detection] ตรวจพบคำสำคัญในชื่อไฟล์: ${filename}`);
            
            // ข้อ 2: ตรวจสอบประเภทแบบภาษีเฉพาะ (เรียงตามลำดับความเฉพาะเจาะจง)
            // ⚠️ สำคัญ: ตรวจสอบ Pay-in ก่อน ภ.พ.30 เพื่อให้เลือก Pay-in เมื่อเจอทั้งสองคำในชื่อไฟล์
            
            // ตรวจสอบ Pay-in (ต้องตรวจสอบก่อน ภ.พ.30)
            const hasPayIn = filenameLower.includes('pay-in') || filename.includes('PAY-IN');
            if (hasPayIn) {
                console.log(`✅ [File Detection] ตรวจพบ "Pay-in" → ใช้ระบบ OCR พิเศษสำหรับ Pay-in ชำระภาษี: ${filename}`);
                return 'payin';
            }
            
            // ตรวจสอบ ภ.พ.30
            const hasPP30 = filenameOriginal.includes('ภ.พ.30') || 
                           filenameOriginal.includes('ภ.พ. 30') ||
                           filenameLower.includes('ภพ30') || 
                           filenameLower.includes('ภพ.30');
            if (hasPP30) {
                console.log(`✅ [File Detection] ตรวจพบ "ภ.พ.30" → ใช้ระบบ OCR พิเศษสำหรับ ภ.พ.30: ${filename}`);
                return 'pp30';
            }
            
            // ตรวจสอบ ภ.พ.36
            const hasPP36 = filenameOriginal.includes('ภ.พ.36') || 
                           filenameOriginal.includes('ภ.พ. 36') ||
                           filenameLower.includes('ภพ36') || 
                           filenameLower.includes('ภพ.36');
            if (hasPP36) {
                console.log(`✅ [File Detection] ตรวจพบ "ภ.พ.36" → ใช้ระบบ OCR พิเศษสำหรับ ภ.พ.36: ${filename}`);
                return 'pp36';
            }
            
            // ตรวจสอบ ภ.ง.ด.1
            const hasPPND1 = filenameOriginal.includes('ภ.ง.ด.1') || 
                            filenameOriginal.includes('ภ.ง.ด. 1') ||
                            filenameLower.includes('ภงด1') || 
                            filenameLower.includes('ภงด.1');
            if (hasPPND1) {
                console.log(`✅ [File Detection] ตรวจพบ "ภ.ง.ด.1" → ใช้ระบบ OCR พิเศษสำหรับ ภ.ง.ด.1: ${filename}`);
                return 'ppnd1';
            }
            
            // ตรวจสอบ ภ.ง.ด.3
            const hasPPND3 = filenameOriginal.includes('ภ.ง.ด.3') || 
                            filenameOriginal.includes('ภ.ง.ด. 3') ||
                            filenameLower.includes('ภงด3') || 
                            filenameLower.includes('ภงด.3');
            if (hasPPND3) {
                console.log(`✅ [File Detection] ตรวจพบ "ภ.ง.ด.3" → ใช้ระบบ OCR พิเศษสำหรับ ภ.ง.ด.3: ${filename}`);
                return 'ppnd3';
            }
            
            // ตรวจสอบ ภ.ง.ด.53
            const hasPPND53 = filenameOriginal.includes('ภ.ง.ด.53') || 
                              filenameOriginal.includes('ภ.ง.ด. 53') ||
                              filenameLower.includes('ภงด53') || 
                              filenameLower.includes('ภงด.53');
            if (hasPPND53) {
                console.log(`✅ [File Detection] ตรวจพบ "ภ.ง.ด.53" → ใช้ระบบ OCR พิเศษสำหรับ ภ.ง.ด.53: ${filename}`);
                return 'ppnd53';
            }
            
            // ตรวจสอบ ภ.ง.ด.54
            const hasPPND54 = filenameOriginal.includes('ภ.ง.ด.54') || 
                              filenameOriginal.includes('ภ.ง.ด. 54') ||
                              filenameLower.includes('ภงด54') || 
                              filenameLower.includes('ภงด.54');
            if (hasPPND54) {
                console.log(`✅ [File Detection] ตรวจพบ "ภ.ง.ด.54" → ใช้ระบบ OCR พิเศษสำหรับ ภ.ง.ด.54: ${filename}`);
                return 'ppnd54';
            }
            
            // ตรวจสอบ ประกันสังคม
            const hasSocialSecurity = filenameLower.includes('ประกันสังคม');
            if (hasSocialSecurity) {
                console.log(`✅ [File Detection] ตรวจพบ "ประกันสังคม" → ใช้ระบบ OCR พิเศษสำหรับประกันสังคม: ${filename}`);
                return 'social_security';
            }
            
            // ตรวจสอบ กยศ.
            const hasKYS = filenameLower.includes('กยศ') || filenameLower.includes('กยศ.');
            if (hasKYS) {
                console.log(`✅ [File Detection] ตรวจพบ "กยศ" → ใช้ระบบ OCR พิเศษสำหรับกยศ.: ${filename}`);
                return 'kys';
            }
            
            // ไม่พบแบบภาษีเฉพาะ → ใช้ระบบ OCR ทั่วไป
            console.log(`✅ [File Detection] ไม่พบแบบภาษีเฉพาะ → ใช้ระบบ OCR ทั่วไป: ${filename}`);
            return 'tax_filing';
        }
        
        // ฟังก์ชัน handleFileSelect - ตรวจสอบชื่อไฟล์อัตโนมัติ
        function handleFileSelect(event) {
            // ป้องกันการเรียกซ้ำ
            if (isProcessingFile) {
                console.log('⚠️ [File Upload] กำลังประมวลผลไฟล์อยู่ กรุณารอ...');
                return;
            }
            
            // ✅ ตรวจสอบว่าเลือก Email Template หรือยัง
            const templateSelect = document.getElementById('emailTemplate');
            if (!templateSelect || !templateSelect.value || templateSelect.value === '') {
                alert('⚠️ กรุณาเลือก Email Template ก่อนอัปโหลดไฟล์');
                event.target.value = ''; // Clear file input
                return;
            }
            
            const files = event.target.files;
            if (files.length === 0) return;
            
            // ตั้ง flag เพื่อป้องกันการเรียกซ้ำ
            isProcessingFile = true;
            
            // ตรวจสอบไฟล์ทีละไฟล์และอัปโหลดอัตโนมัติ
            let processedCount = 0;
            Array.from(files).forEach((file, index) => {
                // ตรวจสอบประเภทไฟล์จากชื่อไฟล์
                const fileType = detectFileTypeFromFilename(file.name);
                
                // อัปโหลดไฟล์ด้วยประเภทที่ตรวจพบอัตโนมัติ
                processFileUpload(file, index, fileType);
                processedCount++;
            });
            
            // ถ้าทุกไฟล์ถูกประมวลผลแล้ว ให้รีเซ็ต flag
            // (processFileUpload จะรีเซ็ต flag เองเมื่อเสร็จ)
            if (processedCount === 0) {
                isProcessingFile = false;
            }
        }
        
        // ฟังก์ชันตรวจสอบว่าระบบจะใช้ OCR อะไร
        function detectOCRSystem(filename) {
            const filenameLower = filename.toLowerCase();
            const detectedSystems = [];
            
            // ตรวจสอบจากชื่อไฟล์
            if (filenameLower.includes('ภ.พ.30') || filenameLower.includes('ภพ.30') || filenameLower.includes('ภพ30')) {
                detectedSystems.push({
                    name: 'PP30 OCR Processor',
                    description: 'ระบบ OCR พิเศษสำหรับแบบภาษี ภ.พ.30',
                    icon: '📄'
                });
            } else if (filenameLower.includes('pay-in')) {
                detectedSystems.push({
                    name: 'Tax OCR Processor',
                    description: 'ระบบ OCR สำหรับ Pay-in ชำระภาษี',
                    icon: '💰'
                });
            } else if (filenameLower.includes('แบบ')) {
                // ตรวจสอบจากรายการแบบภาษีที่อัปโหลดแล้ว
                const checklist = document.getElementById('taxFormChecklist');
                if (checklist) {
                    const checklistItems = checklist.querySelectorAll('div');
                    checklistItems.forEach(item => {
                        const text = item.textContent.trim();
                        if (text.includes('☑') || text.includes('✓')) {
                            // ถ้ามีแบบภาษีที่ถูกเลือกแล้ว
                            const formName = text.replace(/[☑✓☐]/g, '').trim();
                            if (formName === 'ภ.พ.30') {
                                detectedSystems.push({
                                    name: 'PP30 OCR Processor',
                                    description: 'ระบบ OCR พิเศษสำหรับแบบภาษี ภ.พ.30 (อิงจากรายการแบบภาษีที่อัปโหลดแล้ว)',
                                    icon: '📄'
                                });
                            } else if (formName === 'Pay-in ชำระภาษี') {
                                detectedSystems.push({
                                    name: 'Tax OCR Processor',
                                    description: 'ระบบ OCR สำหรับ Pay-in ชำระภาษี (อิงจากรายการแบบภาษีที่อัปโหลดแล้ว)',
                                    icon: '💰'
                                });
                            } else {
                                detectedSystems.push({
                                    name: 'Tax OCR Processor',
                                    description: `ระบบ OCR สำหรับ${formName}`,
                                    icon: '📋'
                                });
                            }
                        }
                    });
                }
                
                // ถ้ายังไม่เจอ ให้ใช้ระบบทั่วไป
                if (detectedSystems.length === 0) {
                    detectedSystems.push({
                        name: 'Tax OCR Processor',
                        description: 'ระบบ OCR สำหรับแบบยื่นภาษีทั่วไป',
                        icon: '📋'
                    });
                }
            }
            
            return detectedSystems;
        }
        
        // ฟังก์ชันแสดง modal เลือกแบบภาษี - ไม่ใช้แล้ว (ระบบตรวจสอบชื่อไฟล์อัตโนมัติ)
        // function showTaxFormSelectModal(file, index) { ... }
        
        // ฟังก์ชันปิด modal เลือกแบบภาษี - ไม่ใช้แล้ว (ระบบตรวจสอบชื่อไฟล์อัตโนมัติ)

        // ฟังก์ชันสำหรับอัปโหลดไฟล์จริงๆ
        function processFileUpload(file, index, selectedTaxForm = null) {
            const fileList = document.getElementById('fileList');
            const formData = new FormData();
            formData.append('file', file);
            
            // ถ้าไม่ได้ระบุ selectedTaxForm ให้ตรวจสอบจากชื่อไฟล์อัตโนมัติ
            let fileType = 'tax_attachment';
            let shouldDoOCR = false;
            
            if (selectedTaxForm) {
                // ใช้ค่าที่ส่งมา (จาก detectFileTypeFromFilename)
                fileType = selectedTaxForm;
                // รายการ file types ที่ต้องทำ OCR
                const ocrTypes = ['pp30', 'pp36', 'ppnd1', 'ppnd3', 'ppnd53', 'ppnd54', 'social_security', 'kys', 'payin', 'tax_filing'];
                shouldDoOCR = ocrTypes.includes(selectedTaxForm);
            } else {
                // ตรวจสอบจากชื่อไฟล์อัตโนมัติ (fallback)
                fileType = detectFileTypeFromFilename(file.name);
                const ocrTypes = ['pp30', 'pp36', 'ppnd1', 'ppnd3', 'ppnd53', 'ppnd54', 'social_security', 'kys', 'payin', 'tax_filing'];
                shouldDoOCR = ocrTypes.includes(fileType);
            }
            
            formData.append('file_type', fileType);
            // ส่ง tax_form_type สำหรับ specialized processors
            const specializedTypes = ['pp30', 'pp36', 'ppnd1', 'ppnd3', 'ppnd53', 'ppnd54', 'social_security', 'kys', 'payin'];
            formData.append('tax_form_type', specializedTypes.includes(fileType) ? fileType : '');
            
            console.log(`📋 [File Upload] Uploading file: ${file.name} (Type: ${fileType}, OCR: ${shouldDoOCR ? 'Yes' : 'No'})`);
            
            // ถ้าต้องทำ OCR ให้เพิ่มในรายการที่กำลังประมวลผล
            if (shouldDoOCR) {
                ocrProcessingFiles.add(file.name);
                updateOCRLoadingModal();
            }
            
            // แสดงสถานะกำลังอัปโหลด
            const loadingItem = document.createElement('div');
            loadingItem.id = `loading-${file.name}-${index}`;
            loadingItem.style.cssText = 'padding: 8px; margin: 5px 0; background: #1e3a5f; border-radius: 5px; display: flex; justify-content: space-between; align-items: center;';
            loadingItem.innerHTML = `
                <span style="color: #cbd5e1;">📋 ${file.name} <span style="color: #60a5fa;">(กำลังอัปโหลด${shouldDoOCR ? ' และประมวลผล OCR...' : '...'})</span></span>
            `;
            fileList.appendChild(loadingItem);
            
            fetch('/api/email/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(data => {
                        throw new Error(data.message || `HTTP ${response.status}`);
                    });
                }
                return response.json();
            })
            .then(data => {
                // รีเซ็ต flag หลังจากอัปโหลดเสร็จ (ไม่ว่าจะสำเร็จหรือไม่)
                isProcessingFile = false;
                
                if (data.success) {
                    const fileData = {
                        file_id: data.file_id,
                        filename: data.filename,
                        temp_path: data.temp_path,
                        file_type: shouldDoOCR ? 'tax_filing' : 'tax_attachment',
                        ocr_result: data.ocr_result || null
                    };
                    
                    // เก็บไฟล์ใน array ที่เหมาะสม
                    if (shouldDoOCR) {
                        uploadedTaxFilingFiles.push(fileData);
                    } else {
                        uploadedTaxAttachmentFiles.push(fileData);
                    }
                    
                    // อัปเดตรายการไฟล์
                    const fileItem = document.createElement('div');
                    fileItem.id = `file-${data.file_id}`;
                    fileItem.style.cssText = 'padding: 8px; margin: 5px 0; background: #0f172a; border-radius: 5px; display: flex; justify-content: space-between; align-items: center;';
                    
                    let fileInfo = '';
                    if (shouldDoOCR && data.ocr_result && data.ocr_result.success) {
                        const ocr = data.ocr_result;
                        fileInfo = `
                            <div style="margin-top: 8px;">
                                <span style="color: #4CAF50; font-size: 12px;">✅ OCR สำเร็จ: ${ocr.tax_form_type || 'ไม่ทราบประเภท'}</span>
                            </div>
                        `;
                    } else if (shouldDoOCR && data.ocr_result && !data.ocr_result.success) {
                        fileInfo = `
                            <div style="margin-top: 8px;">
                                <span style="color: #f87171; font-size: 12px;">⚠️ OCR: ${data.ocr_result?.error || 'ไม่สามารถอ่านข้อมูลได้'}</span>
                            </div>
                        `;
                    }
                    
                    fileItem.innerHTML = `
                        <div style="flex: 1;">
                            <span style="color: #cbd5e1;">📎 ${data.filename}</span>
                            ${fileInfo}
                        </div>
                        <button type="button" onclick="removeFile('${data.file_id}', ${shouldDoOCR})" style="background: #dc2626; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12px;">🗑️ ลบ</button>
                    `;
                    
                    // แทนที่ loading item ก่อน
                    const loadingEl = document.getElementById(`loading-${file.name}-${index}`);
                    if (loadingEl) {
                        loadingEl.replaceWith(fileItem);
                    } else {
                        fileList.appendChild(fileItem);
                    }
                    
                    // ลบไฟล์ออกจากรายการที่กำลังประมวลผล OCR (หลังจากแทนที่ loading item แล้ว)
                    if (shouldDoOCR) {
                        ocrProcessingFiles.delete(file.name);
                        // เรียก updateOCRLoadingModal() หลังจาก DOM อัปเดตแล้ว
                        setTimeout(() => {
                            updateOCRLoadingModal();
                        }, 100);
                    }
                    
                    console.log(`✅ [File Upload] File "${data.filename}" uploaded successfully`);
                    
                    // ⚠️ สำคัญ: ไม่มีการส่งอีเมลอัตโนมัติที่นี่
                    // ระบบจะอัปเดตข้อมูลในฟอร์มเท่านั้น ผู้ใช้ต้องกดปุ่ม "ส่งอีเมลล์" เอง
                    
                    // อัปเดตข้อมูลสรุป (JSON) อัตโนมัติจาก OCR
                    if (shouldDoOCR) {
                        // เก็บค่า template ที่ผู้ใช้เลือกไว้ก่อน (ป้องกันไม่ให้ถูกเปลี่ยนอัตโนมัติ)
                        const templateSelect = document.getElementById('emailTemplate');
                        const currentTemplate = templateSelect ? templateSelect.value : '';
                        
                        // ต้องเรียก updateMonthSummary() ก่อนเพื่อให้ monthMismatchData ถูกอัปเดต
                        updateMonthSummary();
                        updateSummaryDataFromOCR();
                        updateTaxFormChecklist();
                        validateTemplateTaxForms(); // ตรวจสอบความถูกต้องของแบบภาษี
                        updatePaymentDueDateFromOCR();
                        updateFilingTypeSummary();
                        // อัปเดต Subject และ Body อัตโนมัติ
                        updateEmailContentFromOCR();
                        
                        // **Auto-select pattern จาก Tax ID ที่อ่านได้จาก OCR**
                        // ⚠️ ไม่มีการส่งอีเมลอัตโนมัติ - แค่เลือก pattern เท่านั้น
                        if (data.ocr_result && data.ocr_result.success && data.ocr_result.tax_id) {
                            const taxId = data.ocr_result.tax_id;
                            console.log('🔍 พบ Tax ID จาก OCR:', taxId);
                            // ตรวจสอบว่ายังไม่ได้เลือก pattern อยู่
                            const currentPattern = document.getElementById('emailPattern').value;
                            if (!currentPattern || currentPattern === '') {
                                console.log('💡 กำลังค้นหา pattern ที่ตรงกับ Tax ID...');
                                autoSelectPatternByTaxId(taxId);
                            } else {
                                console.log('ℹ️ มี pattern เลือกอยู่แล้ว:', currentPattern);
                            }
                        }
                        
                        // คืนค่า template ที่ผู้ใช้เลือกไว้ (ป้องกันไม่ให้ถูกเปลี่ยนอัตโนมัติ)
                        if (currentTemplate && templateSelect) {
                            // ตรวจสอบว่า template ถูกเปลี่ยนหรือไม่
                            if (templateSelect.value !== currentTemplate) {
                                console.log('⚠️ Template ถูกเปลี่ยนอัตโนมัติ - คืนค่าเดิม:', currentTemplate);
                                templateSelect.value = currentTemplate;
                                // ไม่ต้องเรียก loadEmailTemplate() เพราะเราแค่คืนค่าเดิม
                            }
                        }
                        
                        // **สร้างข้อความ LINE อัตโนมัติหลังจากอ่าน OCR สำเร็จ**
                        // ⚠️ ไม่มีการส่งอีเมลอัตโนมัติ - แค่สร้างข้อความ LINE เท่านั้น
                        setTimeout(() => {
                            // ตรวจสอบว่ามีตัวเลขยอดเงินหรือไม่
                            const hasAmount = checkIfHasAmounts();
                            if (hasAmount) {
                                console.log('✅ พบข้อมูลยอดเงินจาก OCR - สร้างข้อความ LINE อัตโนมัติ');
                                generateLineMessageFromOCR();
                            } else {
                                console.log('⚠️ ยังไม่พบข้อมูลยอดเงิน - ข้ามการสร้างข้อความ LINE');
                            }
                        }, 500);
                    }
                } else {
                    const errorMsg = data.message || 'ไม่ทราบสาเหตุ';
                    console.error(`❌ [File Upload] Upload failed: ${errorMsg}`);
                    alert('❌ ไม่สามารถอัปโหลดไฟล์ "' + file.name + '" ได้: ' + errorMsg);
                    
                    // ลบ loading item
                    const loadingEl = document.getElementById(`loading-${file.name}-${index}`);
                    if (loadingEl) {
                        loadingEl.remove();
                    }
                }
            })
            .catch(error => {
                // ลบไฟล์ออกจากรายการที่กำลังประมวลผล OCR
                if (shouldDoOCR) {
                    ocrProcessingFiles.delete(file.name);
                    updateOCRLoadingModal();
                }
                
                // รีเซ็ต flag เมื่อเกิด error
                isProcessingFile = false;
                
                console.error('❌ [File Upload] Error uploading file:', error);
                const errorMsg = error.message || 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
                alert('❌ เกิดข้อผิดพลาดในการอัปโหลดไฟล์ "' + file.name + '": ' + errorMsg);
                
                // ลบ loading item
                const loadingEl = document.getElementById(`loading-${file.name}-${index}`);
                if (loadingEl) {
                    loadingEl.remove();
                }
            });
        }
        
        // ฟังก์ชันลบไฟล์
        function removeFile(fileId, isTaxFiling) {
            if (!confirm('คุณต้องการลบไฟล์นี้หรือไม่?')) {
                return;
            }
            
            fetch(`/api/email/upload/${fileId}`, {
                method: 'DELETE'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // ลบไฟล์จาก array
                    if (isTaxFiling) {
                        uploadedTaxFilingFiles = uploadedTaxFilingFiles.filter(f => f.file_id !== fileId);
                        // ต้องเรียก updateMonthSummary() ก่อนเพื่อให้ monthMismatchData ถูกอัปเดต
                        updateMonthSummary();
                        updateSummaryDataFromOCR();
                        updateTaxFormChecklist();
                        validateTemplateTaxForms(); // ตรวจสอบความถูกต้องของแบบภาษี
                        updatePaymentDueDateFromOCR();
                        updateFilingTypeSummary();
                        // อัปเดต Subject และ Body อัตโนมัติ
                        updateEmailContentFromOCR();
                    } else {
                        uploadedTaxAttachmentFiles = uploadedTaxAttachmentFiles.filter(f => f.file_id !== fileId);
                    }
                    
                    // ตรวจสอบความถูกต้องของแบบภาษีที่อัปโหลดกับ Template ที่เลือก
                    validateTemplateTaxForms();
                    
                    // ลบ element จาก DOM
                    const fileItem = document.getElementById(`file-${fileId}`);
                    if (fileItem) {
                        fileItem.remove();
                    }
                    
                    console.log(`✅ [File Upload] File ${fileId} deleted successfully`);
                } else {
                    alert('❌ ไม่สามารถลบไฟล์ได้: ' + (data.message || 'ไม่ทราบสาเหตุ'));
                }
            })
            .catch(error => {
                console.error('❌ [File Upload] Error deleting file:', error);
                alert('❌ เกิดข้อผิดพลาดในการลบไฟล์');
            });
        }

            if (!textarea) {

                const dataObj = jsonData.data || jsonData;

        // ฟังก์ชันสำหรับตรวจสอบและอัปเดตรายการแบบภาษี
        function detectTaxFormType(fileData) {
            const filename = (fileData.filename || '').toLowerCase();
            
            // ตรวจสอบจาก OCR result ก่อน (เพราะข้อมูลจาก OCR น่าเชื่อถือที่สุด)
            if (fileData.ocr_result && fileData.ocr_result.success) {
                const taxFormType = fileData.ocr_result.tax_form_type;
                if (taxFormType) {
                    const formTypeLower = taxFormType.toLowerCase();
                    // แปลงรูปแบบให้ตรงกับรายการ
                    if (formTypeLower.includes('ภ.ง.ด.1') || formTypeLower.includes('ภงด.1') || formTypeLower.includes('ภงด1')) return 'ภ.ง.ด.1';
                    if (formTypeLower.includes('ภ.ง.ด.3') || formTypeLower.includes('ภงด.3') || formTypeLower.includes('ภงด3')) return 'ภ.ง.ด.3';
                    if (formTypeLower.includes('ภ.ง.ด.53') || formTypeLower.includes('ภงด.53') || formTypeLower.includes('ภงด53')) return 'ภ.ง.ด.53';
                    if (formTypeLower.includes('ภ.พ.30') || formTypeLower.includes('ภพ.30') || formTypeLower.includes('ภพ30')) return 'ภ.พ.30';
                    if (formTypeLower.includes('ภ.พ.36') || formTypeLower.includes('ภพ.36') || formTypeLower.includes('ภพ36')) return 'ภ.พ.36';
                    if (formTypeLower.includes('ภ.ง.ด.54') || formTypeLower.includes('ภงด.54') || formTypeLower.includes('ภงด54')) return 'ภ.ง.ด.54';
                    
                    // ตรวจสอบกองทุน กยศ. ก่อน (เพราะอาจมีคำว่า "pay-in" ใน tax_form_type)
                    if (formTypeLower.includes('กองทุน กยศ.') || formTypeLower.includes('กยศ.')) return 'กองทุน กยศ.';
                    
                    // ตรวจสอบ Pay-in
                    if (formTypeLower.includes('pay-in') || formTypeLower.includes('payin')) {
                        // ตรวจสอบว่าเป็น Pay-in กองทุน กยศ. หรือ Pay-in ชำระภาษี
                        if (formTypeLower.includes('กยศ') || formTypeLower.includes('กองทุน')) {
                            return 'กองทุน กยศ.';
                        }
                        return 'Pay-in ชำระภาษี';
                    }
                }
                
                // ตรวจสอบจาก amounts
                const amounts = fileData.ocr_result.amounts || {};
                if (amounts['ประกันสังคม']) return 'ประกันสังคม';
                if (amounts['กองทุน กยศ.'] || amounts['กยศ.'] || amounts['กยศ']) return 'กองทุน กยศ.';
                // ตรวจสอบ ภ.พ.30 จาก amounts
                if (amounts['ยอดขายในเดือนนี้ (ภ.พ.30)'] || amounts['ยอดขายที่ต้องเสียภาษี (ภ.พ.30)'] || 
                    amounts['ต้องชำระ (ภ.พ.30)'] || amounts['ภาษีซื้อเดือนนี้ (ภ.พ.30)']) {
                    return 'ภ.พ.30';
                }
            }
            
            // ตรวจสอบจากชื่อไฟล์
            // ตรวจสอบกองทุน กยศ. ก่อน (เพราะอาจมีคำว่า "pay-in" หรือ "slip" ในชื่อไฟล์)
            if (filename.includes('กยศ') || filename.includes('กองทุน')) {
                return 'กองทุน กยศ.';
            }
            
            if (filename.includes('ภ.ง.ด.1') || filename.includes('ภงด.1') || filename.includes('ภงด1')) return 'ภ.ง.ด.1';
            if (filename.includes('ภ.ง.ด.3') || filename.includes('ภงด.3') || filename.includes('ภงด3')) return 'ภ.ง.ด.3';
            if (filename.includes('ภ.ง.ด.53') || filename.includes('ภงด.53') || filename.includes('ภงด53')) return 'ภ.ง.ด.53';
            if (filename.includes('ภ.พ.30') || filename.includes('ภพ.30') || filename.includes('ภพ30')) return 'ภ.พ.30';
            if (filename.includes('ภ.พ.36') || filename.includes('ภพ.36') || filename.includes('ภพ36')) return 'ภ.พ.36';
            if (filename.includes('ภ.ง.ด.54') || filename.includes('ภงด.54') || filename.includes('ภงด54')) return 'ภ.ง.ด.54';
            if (filename.includes('ประกันสังคม')) return 'ประกันสังคม';
            
            // ตรวจสอบ Pay-in ชำระภาษี (หลังจากตรวจสอบกองทุน กยศ. แล้ว)
            if (filename.includes('pay-in') || filename.includes('payin') || 
                (filename.includes('ชำระ') && filename.includes('ภาษี')) ||
                filename.includes('slip') || filename.includes('receipt')) {
                return 'Pay-in ชำระภาษี';
            }
            
            return null;
        }
        
        // ฟังก์ชันสำหรับอัปเดตรายการแบบภาษี
        function updateTaxFormChecklist() {
            const checklist = document.getElementById('taxFormChecklist');
            if (!checklist) return;
            
            // ตรวจสอบ Template ที่เลือก
            const templateSelect = document.getElementById('emailTemplate');
            const templateValue = templateSelect ? templateSelect.value : '';
            
            // กำหนดรายการแบบภาษีตาม Template
            let allowedForms = [];
            if (templateValue === 'template1' || !templateValue) {
                // Template 1: แสดงทั้งหมด (หรือไม่ได้เลือก Template)
                allowedForms = ['ภ.ง.ด.1', 'ภ.ง.ด.3', 'ภ.ง.ด.53', 'ภ.พ.30', 'ภ.พ.36', 'ภ.ง.ด.54', 'ประกันสังคม', 'กองทุน กยศ.', 'Pay-in ชำระภาษี'];
            } else if (templateValue === 'template2') {
                // Template 2: ยื่นแบบมีหัก ณ ที่จ่าย (แสดง ภ.พ.36, ไม่แสดงแค่ ภ.พ.30)
                allowedForms = ['ภ.ง.ด.1', 'ภ.ง.ด.3', 'ภ.ง.ด.53', 'ภ.ง.ด.54', 'ภ.พ.36', 'ประกันสังคม', 'กองทุน กยศ.', 'Pay-in ชำระภาษี'];
            } else if (templateValue === 'template3') {
                // Template 3: มีแค่ ภ.พ.30 และ Pay-in
                allowedForms = ['ภ.พ.30', 'Pay-in ชำระภาษี'];
            }
            
            // เก็บแบบภาษีที่พบพร้อมจำนวนไฟล์
            const foundForms = new Map();
            
            // ตรวจสอบจากไฟล์แบบยื่นภาษี (นับเฉพาะที่ OCR สำเร็จ)
            uploadedTaxFilingFiles.forEach(file => {
                // ตรวจสอบว่า OCR สำเร็จหรือไม่
                if (file.ocr_result && file.ocr_result.success === true) {
                    const formType = detectTaxFormType(file);
                    if (formType && allowedForms.includes(formType)) {
                        const count = foundForms.get(formType) || 0;
                        foundForms.set(formType, count + 1);
                    }
                }
            });
            
            // ตรวจสอบจากไฟล์ใบแนบภาษี (สำหรับ Pay-in) - นับเฉพาะที่ OCR สำเร็จ
            uploadedTaxAttachmentFiles.forEach(file => {
                // ตรวจสอบว่า OCR สำเร็จหรือไม่
                if (file.ocr_result && file.ocr_result.success === true) {
                    const formType = detectTaxFormType(file);
                    if (formType && allowedForms.includes(formType)) {
                        const count = foundForms.get(formType) || 0;
                        foundForms.set(formType, count + 1);
                    }
                }
            });
            
            // อัปเดต UI - แสดงเฉพาะที่อยู่ใน allowedForms
            let html = '';
            allowedForms.forEach(formType => {
                const fileCount = foundForms.get(formType) || 0;
                const isChecked = fileCount > 0;
                html += `
                    <div class="tax-form-item" data-form="${formType}" style="padding: 8px; background: ${isChecked ? '#1e3a1e' : '#1e293b'}; border-radius: 5px; display: flex; align-items: center; justify-content: space-between; gap: 8px; ${isChecked ? 'border-left: 3px solid #27ae60;' : ''}">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="color: ${isChecked ? '#27ae60' : '#94a3b8'}; font-size: 16px;">${isChecked ? '✓' : '☐'}</span>
                            <span style="color: ${isChecked ? '#cbd5e1' : '#94a3b8'}; font-size: 14px; font-weight: ${isChecked ? 'bold' : 'normal'};">${formType}</span>
                        </div>
                        ${isChecked ? `<span style="color: #27ae60; font-size: 12px; background: #0f172a; padding: 2px 6px; border-radius: 3px;">${fileCount}</span>` : ''}
                    </div>
                `;
            });
            
            checklist.innerHTML = html;
            console.log(`✅ อัปเดตรายการแบบภาษีตาม Template (${templateValue}):`, allowedForms);
            
            // ✅ ซ่อน/แสดงช่องกรอกยอดเงินตาม Template
            const pp30Container = document.getElementById('fieldPP30Container');
            const pp36Container = document.getElementById('fieldPP36Container');
            
            if (pp30Container && pp36Container) {
                if (templateValue === 'template2') {
                    // Template 2: ยื่นแบบมีหัก ณ ที่จ่าย → ซ่อนแค่ ภ.พ.30, แสดง ภ.พ.36
                    pp30Container.style.display = 'none';
                    pp36Container.style.display = 'block';
                    console.log('🔒 ซ่อนช่อง ภ.พ.30, แสดง ภ.พ.36 (Template 2)');
                } else if (templateValue === 'template3') {
                    // Template 3: ยื่นแบบ ภ.พ.30 → แสดงแค่ ภ.พ.30, ซ่อน ภ.พ.36
                    pp30Container.style.display = 'block';
                    pp36Container.style.display = 'none';
                    console.log('👁️ แสดงช่อง ภ.พ.30, ซ่อน ภ.พ.36 (Template 3)');
                } else {
                    // Template 1 หรือไม่ได้เลือก → แสดงทั้งหมด
                    pp30Container.style.display = 'block';
                    pp36Container.style.display = 'block';
                    console.log('👁️ แสดงช่อง ภ.พ.30 และ ภ.พ.36 (Template 1 หรือ Default)');
                }
            }
            
            // ตรวจสอบความถูกต้องของแบบภาษีที่อัปโหลดกับ Template ที่เลือก
            validateTemplateTaxForms();
        }
        
        // ฟังก์ชันตรวจสอบความถูกต้องของแบบภาษีที่อัปโหลดกับ Template ที่เลือก
        function validateTemplateTaxForms() {
            const templateSelect = document.getElementById('emailTemplate');
            const templateValue = templateSelect ? templateSelect.value : '';
            const alertDiv = document.getElementById('templateValidationAlert');
            const messageDiv = document.getElementById('templateValidationMessage');
            
            if (!alertDiv || !messageDiv) return;
            
            // ถ้ายังไม่ได้เลือก Template ให้ซ่อนการแจ้งเตือน
            if (!templateValue) {
                alertDiv.style.display = 'none';
                return;
            }
            
            // กำหนดรายการแบบภาษีที่อนุญาตตาม Template
            let allowedForms = [];
            let templateName = '';
            if (templateValue === 'template1') {
                allowedForms = ['ภ.ง.ด.1', 'ภ.ง.ด.3', 'ภ.ง.ด.53', 'ภ.พ.30', 'ภ.พ.36', 'ภ.ง.ด.54', 'ประกันสังคม', 'กองทุน กยศ.', 'Pay-in ชำระภาษี'];
                templateName = '1. ยื่นแบบมีหัก ณ ที่จ่ายและภาษีมูลค่าเพิ่ม';
            } else if (templateValue === 'template2') {
                allowedForms = ['ภ.ง.ด.1', 'ภ.ง.ด.3', 'ภ.ง.ด.53', 'ภ.ง.ด.54', 'ภ.พ.36', 'ประกันสังคม', 'กองทุน กยศ.', 'Pay-in ชำระภาษี'];
                templateName = '2. ยื่นแบบมีหัก ณ ที่จ่าย';
            } else if (templateValue === 'template3') {
                allowedForms = ['ภ.พ.30', 'Pay-in ชำระภาษี'];
                templateName = '3. ยื่นแบบภาษีมูลค่าเพิ่ม';
            } else {
                alertDiv.style.display = 'none';
                return;
            }
            
            // เก็บแบบภาษีที่พบจากไฟล์ที่อัปโหลด
            const uploadedForms = new Set();
            
            // ตรวจสอบจากไฟล์แบบยื่นภาษี
            uploadedTaxFilingFiles.forEach(file => {
                if (file.ocr_result && file.ocr_result.success === true) {
                    const formType = detectTaxFormType(file);
                    if (formType) {
                        uploadedForms.add(formType);
                    }
                }
            });
            
            // ตรวจสอบจากไฟล์ใบแนบภาษี
            uploadedTaxAttachmentFiles.forEach(file => {
                if (file.ocr_result && file.ocr_result.success === true) {
                    const formType = detectTaxFormType(file);
                    if (formType) {
                        uploadedForms.add(formType);
                    }
                }
            });
            
            // ตรวจสอบว่าแบบภาษีที่อัปโหลดมีแบบที่ไม่ได้รับอนุญาตหรือไม่
            const invalidForms = [];
            uploadedForms.forEach(formType => {
                if (!allowedForms.includes(formType)) {
                    invalidForms.push(formType);
                }
            });
            
            // ตรวจสอบว่าแบบภาษีที่จำเป็นมีหรือไม่ (สำหรับ template3 ต้องมี ภ.พ.30)
            const requiredForms = [];
            if (templateValue === 'template3') {
                if (!uploadedForms.has('ภ.พ.30')) {
                    requiredForms.push('ภ.พ.30');
                }
            }
            
            // แสดงการแจ้งเตือนถ้ามีปัญหา
            if (invalidForms.length > 0 || requiredForms.length > 0) {
                let message = '';
                
                if (invalidForms.length > 0) {
                    message += `<div style="margin-bottom: 8px;">Template "${templateName}" ไม่รองรับแบบภาษีต่อไปนี้:</div>`;

        // ฟังก์ชันสำหรับดึงข้อมูล OCR จากไฟล์แบบยื่นภาษี (สำหรับสร้างไฟล์ภาพสรุป)
        function getTaxFilingAmounts() {
            // รวมยอดเงินจากไฟล์แบบยื่นภาษีทั้งหมด
            const allAmounts = {};
            
            uploadedTaxFilingFiles.forEach(file => {
                if (file.ocr_result && file.ocr_result.success && file.ocr_result.amounts) {
                    // รวมยอดเงินจากแต่ละไฟล์
                    for (const [taxType, amount] of Object.entries(file.ocr_result.amounts)) {
                        if (taxType in allAmounts) {
                            allAmounts[taxType] += amount;
                        } else {
                            allAmounts[taxType] = amount;
                        }
                    }
                }
            });
            
            return allAmounts;
        }
        
        // ฟังก์ชันสำหรับดึงชื่อแบบภาษีจากชื่อไฟล์
        function extractTaxFormTypeFromFilename(filename) {
            // หาแบบภาษีจากชื่อไฟล์ เช่น "แบบยื่น ภงด.53 เดือน 10.68.pdf" -> "ภงด.53"
            const patterns = [
                /ภ\.ง\.ด\.(\d+)/,  // ภ.ง.ด.53
                /ภงด\.(\d+)/,     // ภงด.53
                /ภ\.ธ\.(\d+)/,    // ภ.ธ.40
                /ภธ\.(\d+)/       // ภธ.40
            ];
            
            for (const pattern of patterns) {
                const match = filename.match(pattern);
                if (match) {
                    const number = match[1];
                    // ตรวจสอบว่าเป็น ภ.ธ. หรือ ภ.ง.ด.
                    if (filename.includes('ภ.ธ') || filename.includes('ภธ')) {
                        return `ภ.ธ.${number}`;
                    } else {
                        return `ภ.ง.ด.${number}`;
                    }
                }
            }
            
            // ถ้าไม่พบ ให้ลองหาแบบอื่น
            if (filename.includes('ภงด.1') || filename.includes('ภ.ง.ด.1')) return 'ภ.ง.ด.1';
            if (filename.includes('ภงด.3') || filename.includes('ภ.ง.ด.3')) return 'ภ.ง.ด.3';
            if (filename.includes('ภงด.53') || filename.includes('ภ.ง.ด.53')) return 'ภ.ง.ด.53';
            if (filename.includes('ภงด.54') || filename.includes('ภ.ง.ด.54')) return 'ภ.ง.ด.54';
            if (filename.includes('ภธ.40') || filename.includes('ภ.ธ.40')) return 'ภ.ธ.40';
            
            return null;
        }

                return 0;

            const pnd1 = getAmountFromField('summaryAmountPND1');
            const pnd3 = getAmountFromField('summaryAmountPND3');
            const pnd53 = getAmountFromField('summaryAmountPND53');
            const pnd54 = getAmountFromField('summaryAmountPND54');
            const pp36 = getAmountFromField('summaryAmountPP36');

        // ฟังก์ชันตรวจสอบว่าผลรวมของแบบภาษีเท่ากับ Pay-in หรือไม่
        function validateTaxAmounts() {
            // หายอดรวมของแบบภาษี (ภ.ง.ด.1, ภ.ง.ด.3, ภ.ง.ด.53, ภ.ง.ด.54, ภ.พ.36, ภ.พ.30)

            uploadedTaxFilingFiles.forEach(file => {
                if (file.ocr_result && file.ocr_result.success) {
                    const ocrResult = file.ocr_result;
                    const taxFormType = ocrResult.tax_form_type || '';
                    const amounts = ocrResult.amounts || {};
                    
                    // ตรวจสอบว่าเป็นแบบภาษีที่ต้องรวมหรือไม่
                    const isMainTaxForm = taxFormTypes.some(type => taxFormType.includes(type));
                    
                    if (isMainTaxForm) {
                        let amount = 0;
                        
                        if (taxFormType.includes('ภ.ง.ด.1') || taxFormType.includes('ภ.ง.ด.3') || taxFormType.includes('ภ.ง.ด.53')) {
                            amount = amounts['รวมยอดภาษีที่นำส่งทั้งสิ้น และเงินเพิ่ม'] || 0;
                        } else if (taxFormType.includes('ภ.ง.ด.54')) {
                            amount = amounts['รวมเป็นเงินทั้งสิ้น (ภ.ง.ด.54)'] || 0;
                        } else if (taxFormType.includes('ภ.พ.36')) {
                            if (ocrResult.pp36_json && ocrResult.pp36_json_edited) {
                                // ตรวจสอบว่าเป็น JSON structure ใหม่หรือไม่
                                if (ocrResult.pp36_json.data || ocrResult.pp36_json['1. จำนวนที่จ่ายเงิน'] !== undefined) {
                                    // ใช้โครงสร้างใหม่
                                    const parsed = parsePP36FromNewJson(ocrResult.pp36_json);
                                    amount = parsed.vatAmount;
                                } else {
                                    // ใช้โครงสร้างเดิม
                                amount = ocrResult.pp36_json['รวมภาษีมูลค่าเพิ่ม'] || ocrResult.pp36_json['ภาษีมูลค่าเพิ่มที่ต้องนำส่ง'] || 0;
                                }
                            } else {
                                amount = amounts['ภาษีมูลค่าเพิ่ม (ภ.พ.36)'] || amounts['รวมภาษีมูลค่าเพิ่ม (ภ.พ.36)'] || amounts['จำนวนเงินภาษีมูลค่าเพิ่มที่ต้องนำส่ง (ภ.พ.36)'] || 0;
                            }
                        } else if (taxFormType.includes('ภ.พ.30') || taxFormType.includes('ภพ.30')) {
                            // สำหรับ ภ.พ.30 ใช้ "ต้องชำระ (ภ.พ.30)" เป็นหลัก
                            amount = amounts['ต้องชำระ (ภ.พ.30)'] || 0;

                        totalTaxAmount += amount;

            // หายอด Pay-in

                        payInAmount += amount;

            });
            
            // ตรวจสอบว่ามี Pay-in หรือไม่
