                // 6. สำหรับ ภ.ง.ด.1, ภ.ง.ด.3, ภ.ง.ด.53: ใช้ month/year จาก ocrResult โดยตรง
                if ((taxFormType.includes('ภ.ง.ด.1') || taxFormType.includes('ภ.ง.ด.3') || taxFormType.includes('ภ.ง.ด.53')) && ocrResult.month && ocrResult.year) {
                    month = typeof ocrResult.month === 'string' ? monthMap[ocrResult.month] || parseInt(ocrResult.month) : ocrResult.month;
                    year = parseInt(ocrResult.year);
                    if (month && year) return { month, year };
                }
                
                // 7. Fallback: ใช้ month/year จาก ocrResult โดยตรง (สำหรับแบบอื่นๆ)
                if (ocrResult.month && ocrResult.year) {
                    month = typeof ocrResult.month === 'string' ? monthMap[ocrResult.month] || parseInt(ocrResult.month) : ocrResult.month;
                    year = parseInt(ocrResult.year);
                    if (month && year) return { month, year };
                }
                
                return null;
            };
            
            // รวบรวมข้อมูลเดือน/ปีจากทุกไฟล์ (เฉพาะไฟล์ "ยื่นปกติ")
            const monthYearCounts = {}; // { "month_year": count }
            const monthYearData = {}; // { "month_year": { month, year } }
            
            for (const file of uploadedTaxFilingFiles) {
                if (!file.ocr_result || !file.ocr_result.success) continue;
                
                const ocrResult = file.ocr_result;
                const taxFormType = ocrResult.tax_form_type || '';
                
                // ข้ามไฟล์ "ยื่นเพิ่มเติม" - ใช้เฉพาะไฟล์ "ยื่นปกติ"
                if (isSupplementFiling(ocrResult, taxFormType)) {
                    continue;
                }
                
                const monthYearInfo = extractMonthYear(file);
                if (monthYearInfo && monthYearInfo.month && monthYearInfo.year) {
                    const key = `${monthYearInfo.month}_${monthYearInfo.year}`;
                    monthYearCounts[key] = (monthYearCounts[key] || 0) + 1;
                    if (!monthYearData[key]) {
                        monthYearData[key] = monthYearInfo;
                    }
                }
            }
            
            // หาเดือน/ปีที่พบบ่อยที่สุด
            let foundMonth = null;
            let foundYear = null;
            
            if (Object.keys(monthYearCounts).length > 0) {
                // หาเดือน/ปีที่พบบ่อยที่สุด
                const mostCommonKey = Object.keys(monthYearCounts).reduce((a, b) => 
                    monthYearCounts[a] > monthYearCounts[b] ? a : b
                );
                foundMonth = monthYearData[mostCommonKey].month;
                foundYear = monthYearData[mostCommonKey].year;
                console.log(`✅ พบเดือน/ปีที่พบบ่อยที่สุด: ${foundMonth}/${foundYear} (${monthYearCounts[mostCommonKey]} ไฟล์)`);
            } else {
                // ถ้าไม่มีไฟล์ "ยื่นปกติ" ให้ใช้ข้อมูลจากไฟล์ "ยื่นเพิ่มเติม" หรือไฟล์อื่นๆ
                for (const file of uploadedTaxFilingFiles) {
                    const monthYearInfo = extractMonthYear(file);
                    if (monthYearInfo && monthYearInfo.month && monthYearInfo.year) {
                        foundMonth = monthYearInfo.month;
                        foundYear = monthYearInfo.year;
                        console.log(`⚠️ ใช้เดือน/ปีจากไฟล์ (ไม่มีไฟล์ยื่นปกติ): ${foundMonth}/${foundYear}`);
                        break;
                    }
                }
            }
            
            // ถ้าพบข้อมูลเดือน/ปี ให้แปลงและแทนที่ใน Subject และ Body
            if (foundMonth && foundYear) {
                // แปลงปี พ.ศ. เป็น ค.ศ. เต็ม 4 หลัก
                const yearCE = foundYear > 2500 ? foundYear - 543 : foundYear;
                monthYear = `${foundMonth}/${yearCE}`;
                
                // แทนที่ xx/xxxx ด้วยเดือน/ปีจริง (ปี 4 หลัก)
                subject = subject.replace(/xx\/xxxx/g, monthYear);
                body = body.replace(/xx\/xxxx/g, monthYear);
                
                console.log('✅ อัปเดตเดือน/ปี:', monthYear, `(จาก ${foundMonth}/${foundYear})`);
            } else {
                console.log('⚠️ ไม่พบข้อมูลเดือน/ปีจาก OCR - ยังคงใช้ xx/xxxx');
            }
            
            // แทนที่ {company_name} ด้วยชื่อบริษัท (ถ้ามี)
            const companyNameField = document.getElementById('summaryCompany');
            const patternCompanyNameField = document.getElementById('patternCompanyName');
            let companyName = '';
            
            // ลองดึงชื่อบริษัทจาก pattern ที่โหลดมาแล้ว (ถ้ามี)
            if (typeof window.currentPatternCompanyName !== 'undefined' && window.currentPatternCompanyName) {
                companyName = window.currentPatternCompanyName.trim();
                console.log('✅ พบชื่อบริษัทจาก pattern ที่โหลดแล้ว:', companyName);
            }
            
            // ถ้ายังไม่มีชื่อบริษัท ให้ลองจาก field อื่น
            if (!companyName) {
                const patternSelect = document.getElementById('emailPattern');
                if (patternSelect && patternSelect.value) {
                    // ตรวจสอบว่ามี pattern data ใน allPatterns หรือไม่
                    if (typeof allPatterns !== 'undefined' && allPatterns && allPatterns.length > 0) {
                        const selectedPattern = allPatterns.find(p => p.pattern_name === patternSelect.value);
                        if (selectedPattern && selectedPattern.company_name) {
                            companyName = selectedPattern.company_name.trim();
                            console.log('✅ พบชื่อบริษัทจาก allPatterns:', companyName);
                        }
                    }
                }
            }
            
            // ถ้ายังไม่มีชื่อบริษัท ให้ลองจาก field อื่น
            if (!companyName) {
                if (patternCompanyNameField && patternCompanyNameField.value) {
                    companyName = patternCompanyNameField.value.trim();
                } else if (companyNameField && companyNameField.value) {
                    companyName = companyNameField.value.trim();
                } else {
                    // ลองดึงจาก OCR
                    for (const file of uploadedTaxFilingFiles) {
                        if (file.ocr_result && file.ocr_result.success && file.ocr_result.company_name) {
                            companyName = file.ocr_result.company_name;
                            break;
                        }
                    }
                }
            }
            
            if (companyName) {
                subject = subject.replace(/{company_name}/g, companyName);
                body = body.replace(/{company_name}/g, companyName);
                console.log('✅ อัปเดตชื่อบริษัทใน Subject และ Body:', companyName);
                console.log('📝 Subject หลังอัปเดต:', subject);
            } else {
                // ถ้าไม่มีชื่อบริษัท อย่าลบ {company_name} ออก ให้รอจนกว่าจะมีชื่อบริษัท
                // เพราะอาจจะยังไม่ได้โหลด pattern หรือยังไม่ได้อ่าน OCR
                console.log('⚠️ ยังไม่พบชื่อบริษัท - เก็บ {company_name} ไว้รออัปเดตภายหลัง');
                console.log('📝 Subject ยังคงมี {company_name}:', subject);
            }
            
            // อัปเดตวันที่ชำระ (แทนที่ทุก pattern ที่เกี่ยวกับวันที่)
            const paymentDueDateField = document.getElementById('paymentDueDate');
            if (paymentDueDateField && paymentDueDateField.value) {
                const dueDate = paymentDueDateField.value.trim();
                // ใช้วันที่เต็ม 4 หลัก: dd/mm/yyyy
                if (dueDate && dueDate.includes('/')) {
                    // แทนที่หลาย pattern:
                    // 1. xx/xx/xxxx (placeholder เต็ม)
                    body = body.replace(/xx\/xx\/xxxx/gi, dueDate);
                    // 2. xx/mm/yyyy (มีเดือนและปีอยู่แล้ว เช่น xx/10/2025)
                    body = body.replace(/xx\/\d{2}\/\d{4}/gi, dueDate);
                    // 3. dd/xx/xxxx (มีวันอยู่แล้ว)
                    body = body.replace(/\d{2}\/xx\/xxxx/gi, dueDate);
                    
                    console.log('✅ อัปเดตวันที่ชำระ:', dueDate);
                }
            }
            
            // อัปเดตยอดเงิน
            const getAmountFromField = (fieldId) => {
                const field = document.getElementById(fieldId);
                if (field && field.value) {
                    const value = field.value.replace(/,/g, '');
                    const num = parseFloat(value);
                    return isNaN(num) ? 0 : num;
                }
                return 0;
            };
            
            const pnd1 = getAmountFromField('summaryAmountPND1');
            const pnd3 = getAmountFromField('summaryAmountPND3');
            const pnd53 = getAmountFromField('summaryAmountPND53');
            const pnd54 = getAmountFromField('summaryAmountPND54');
            const pp36 = getAmountFromField('summaryAmountPP36');
            const pp30 = getAmountFromField('summaryAmountPP30');
            const socialSecurity = getAmountFromField('summaryAmountSocialSecurity');
            const studentLoan = getAmountFromField('summaryAmountStudentLoan');
            const penaltyFee = getAmountFromField('summaryAmountPenaltyFee');
            
            // สำหรับ template1 และ template2: whtAmount = ภ.ง.ด.1 + ภ.ง.ด.3 + ภ.ง.ด.53 + ภ.ง.ด.54 + ภ.พ.36
            // สำหรับ template1: ภ.พ.30 จะแสดงแยกต่างหาก (ไม่รวมใน whtAmount)
            // สำหรับ template2: ไม่มี ภ.พ.30
            const whtAmount = pnd1 + pnd3 + pnd53 + pnd54 + pp36;
            
            // ตรวจสอบว่าเป็น template1, template2 หรือ template3 หรือไม่
            const templateSelect = document.getElementById('emailTemplate');
            const templateValue = templateSelect ? templateSelect.value : '';
            const isTemplate1 = templateValue === 'template1';
            const isTemplate2 = templateValue === 'template2';
            const isTemplate3 = templateValue === 'template3';
            
            // ตรวจสอบว่ามีแบบเพิ่มเติมหรือไม่
            let hasSupplement = false;
            let supplementAmount = 0;
            let normalAmount = 0;
            
            if (isTemplate1 || isTemplate2 || isTemplate3) {
                // สำหรับ template1, template2 และ template3: แยกยอดแบบปกติและแบบเพิ่มเติม
                uploadedTaxFilingFiles.forEach(file => {
                    if (file.ocr_result && file.ocr_result.success) {
                        const ocrResult = file.ocr_result;
                        const taxFormType = ocrResult.tax_form_type || '';
                        const amounts = ocrResult.amounts || {};
                        
                        // ตรวจสอบว่าเป็นแบบเพิ่มเติมหรือไม่
                        let isSupplement = false;
                        if (taxFormType.includes('ภ.พ.36') || taxFormType.includes('ภพ.36')) {
                            if (ocrResult.pp36_json) {
                                const dataObj = ocrResult.pp36_json.data || ocrResult.pp36_json;
                                const filingTypeSupplement = dataObj['(2) ยื่นเพิ่มเติมครั้งที่'];
                                isSupplement = filingTypeSupplement !== null && filingTypeSupplement !== undefined && filingTypeSupplement !== '';
                            }
                        } else if (taxFormType.includes('ภ.ง.ด.54')) {
                            if (ocrResult.ppnd54_json && ocrResult.ppnd54_json.data) {
                                const filingTypeSupplement = ocrResult.ppnd54_json.data['(2) ยื่นเพิ่มเติมครั้งที่'];
                                isSupplement = filingTypeSupplement !== null && filingTypeSupplement !== undefined && filingTypeSupplement !== '';
                            }
                        } else if (ocrResult.filing_type) {
                            isSupplement = ocrResult.filing_type === 'additional' || 
                                         String(ocrResult.filing_type).includes('เพิ่มเติม');
                        }
                        
                        // คำนวณยอดตามประเภทแบบภาษี
                        let amount = 0;
                        if (taxFormType.includes('ภ.ง.ด.1')) {
                            amount = amounts['รวม (ภ.ง.ด.1)'] || amounts['รวมยอดภาษีที่นำส่งทั้งสิ้น และเงินเพิ่ม (ภ.ง.ด.1)'] || amounts['รวมยอดภาษีที่นำส่งทั้งสิ้น และเงินเพิ่ม'] || 0;
                        } else if (taxFormType.includes('ภ.ง.ด.3')) {
                            amount = amounts['รวมยอดภาษีที่นำส่งทั้งสิ้น (ภ.ง.ด.3)'] || amounts['รวมยอดภาษีที่นำส่งทั้งสิ้น'] || 0;
                        } else if (taxFormType.includes('ภ.ง.ด.53')) {
                            amount = amounts['รวมยอดภาษีที่นำส่งทั้งสิ้น (ภ.ง.ด.53)'] || amounts['รวมยอดภาษีที่นำส่งทั้งสิ้น'] || 0;
                        } else if (taxFormType.includes('ภ.ง.ด.54')) {
                            amount = amounts['รวมเป็นเงินทั้งสิ้น (ภ.ง.ด.54)'] || 0;
                        } else if (taxFormType.includes('ภ.พ.36')) {
                            if (ocrResult.pp36_json && ocrResult.pp36_json_edited) {
                                const pp36Json = ocrResult.pp36_json;
                                if (pp36Json.data || pp36Json['1. จำนวนที่จ่ายเงิน'] !== undefined) {
                                    const parsed = parsePP36FromNewJson(pp36Json);
                                    amount = parsed.vatAmount;
                                } else {
                                    amount = pp36Json['รวมภาษีมูลค่าเพิ่ม'] || pp36Json['ภาษีมูลค่าเพิ่มที่ต้องนำส่ง'] || 0;
                                }
                            } else {
                                amount = amounts['ภาษีมูลค่าเพิ่ม (ภ.พ.36)'] || amounts['รวมภาษีมูลค่าเพิ่ม (ภ.พ.36)'] || amounts['จำนวนเงินภาษีมูลค่าเพิ่มที่ต้องนำส่ง (ภ.พ.36)'] || 0;
                            }
                        } else if (taxFormType.includes('ภ.พ.30')) {
                            // สำหรับ template1 และ template3: รวม ภ.พ.30 ด้วย
                            amount = amounts['ภาษีมูลค่าเพิ่ม (ภ.พ.30)'] || amounts['รวมภาษีมูลค่าเพิ่ม (ภ.พ.30)'] || amounts['จำนวนเงินภาษีมูลค่าเพิ่มที่ต้องนำส่ง (ภ.พ.30)'] || pp30 || 0;
                        }
                        
                        if (isSupplement) {
                            hasSupplement = true;
                            supplementAmount += amount;
                        } else {
                            normalAmount += amount;
                        }
                    }
                });
            }
            
            // ตรวจสอบว่า ภ.ง.ด.1 ไม่มียอดชำระหรือไม่
            let isPND1NoPayment = false;
            if (pnd1 === 0) {
                // ตรวจสอบว่ามีคำว่า "สำหรับใบเสร็จรับเงิน" ใน raw_text หรือไม่
                for (const file of uploadedTaxFilingFiles) {
                    if (file.ocr_result && file.ocr_result.success) {
                        const taxFormType = file.ocr_result.tax_form_type || '';
                        if (taxFormType.includes('ภ.ง.ด.1')) {
                            const rawText = file.ocr_result.raw_text || '';
                            if (rawText.includes('สำหรับใบเสร็จรับเงิน')) {
                                isPND1NoPayment = true;
                                break;
                            }
                        }
                    }
                }
            }
            
            // อัปเดตยอดเงินสำหรับ template1, template2 และ template3
            if (isTemplate1 || isTemplate2 || isTemplate3) {
                // สำหรับ template1, template2 และ template3: แสดงยอดชำระภาษีกรมสรรพากร เดือน xx/xxxx: จำนวน xxxxx บาท
                // สำหรับ template3: ใช้ยอดจาก ภ.พ.30 เท่านั้น
                const displayAmount = isTemplate3 ? pp30 : whtAmount;
                const isNoPayment = isTemplate3 ? false : isPND1NoPayment; // template3 ไม่มีกรณีไม่มียอดชำระ
                
                if (displayAmount > 0 && !isNoPayment) {
                    const displayFormatted = displayAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                    
                    // แทนที่ pattern "ยอดชำระภาษีกรมสรรพากร เดือน xx/xxxx: จำนวน xxxxx บาท"
                    body = body.replace(/- ยอดชำระภาษีกรมสรรพากร เดือน [^\n]+: จำนวน [^\n]+ บาท/g, 
                        `- ยอดชำระภาษีกรมสรรพากร เดือน ${monthYear || 'xx/xxxx'}: จำนวน ${displayFormatted} บาท`);
                    body = body.replace(/- ยอดชำระภาษีกรมสรรพากร เดือน [^\n]+: จำนวน xxxxx บาท/g, 
                        `- ยอดชำระภาษีกรมสรรพากร เดือน ${monthYear || 'xx/xxxx'}: จำนวน ${displayFormatted} บาท`);
                    body = body.replace(/- ยอดชำระภาษีกรมสรรพากร\s*:?\s*จำนวน [^\n]+ บาท/g, 
                        `- ยอดชำระภาษีกรมสรรพากร เดือน ${monthYear || 'xx/xxxx'}: จำนวน ${displayFormatted} บาท`);
                    
                    // สำหรับ template3: แทนที่ pattern เก่า "ภ.พ. 30" ด้วย "ยอดชำระภาษีกรมสรรพากร"
                    if (isTemplate3) {
                        body = body.replace(/- ภ\.พ\.\s*30\s*เดือน [^\n]+: จำนวน [^\n]+ บาท/g, 
                            `- ยอดชำระภาษีกรมสรรพากร เดือน ${monthYear || 'xx/xxxx'}: จำนวน ${displayFormatted} บาท`);
                        body = body.replace(/- ภ\.พ\.\s*30\s*เดือน [^\n]+: จำนวน xxxxx บาท/g, 
                            `- ยอดชำระภาษีกรมสรรพากร เดือน ${monthYear || 'xx/xxxx'}: จำนวน ${displayFormatted} บาท`);
                        body = body.replace(/- ภ\.พ\.\s*30\s*:?\s*จำนวน [^\n]+ บาท/g, 
                            `- ยอดชำระภาษีกรมสรรพากร เดือน ${monthYear || 'xx/xxxx'}: จำนวน ${displayFormatted} บาท`);
                    }
                    
                    // ถ้ามีแบบเพิ่มเติม ให้แสดงแยกรายการ
                    if (hasSupplement && supplementAmount > 0 && normalAmount > 0) {
                        const supplementFormatted = supplementAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        const normalFormatted = normalAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        
                        // แทนที่ด้วยยอดแบบปกติและแบบเพิ่มเติม
                        // หาบรรทัดที่มี "ยอดชำระภาษีกรมสรรพากร" และแทนที่
                        const lines = body.split('\n');
                        for (let i = 0; i < lines.length; i++) {
                            if (lines[i].includes('- ยอดชำระภาษีกรมสรรพากร') && lines[i].includes(monthYear || 'xx/xxxx')) {
                                // แทนที่บรรทัดนี้ด้วย 2 บรรทัด (ปกติและเพิ่มเติม)
                                lines[i] = `- ยอดชำระภาษีกรมสรรพากร เดือน ${monthYear || 'xx/xxxx'}: จำนวน ${normalFormatted} บาท (ยื่นปกติ)\n- ยอดชำระภาษีกรมสรรพากร เดือน ${monthYear || 'xx/xxxx'}: จำนวน ${supplementFormatted} บาท (ยื่นเพิ่มเติม)`;
                                break;
                            }
                        }
                        body = lines.join('\n');
                    } else if (hasSupplement && supplementAmount > 0 && normalAmount === 0) {
                        // ถ้ามีแต่แบบเพิ่มเติม (ไม่มีแบบปกติ)
                        const supplementFormatted = supplementAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        body = body.replace(/- ยอดชำระภาษีกรมสรรพากร เดือน [^\n]+: จำนวน [^\n]+ บาท/g, 
                            `- ยอดชำระภาษีกรมสรรพากร เดือน ${monthYear || 'xx/xxxx'}: จำนวน ${supplementFormatted} บาท (ยื่นเพิ่มเติม)`);
                    }
                    
                    const templateName = isTemplate1 ? 'template1' : (isTemplate2 ? 'template2' : 'template3');
                    console.log(`✅ อัปเดตยอดภาษีหัก ณ ที่จ่าย (${templateName}):`, displayFormatted);
                    if (hasSupplement) {
                        console.log('✅ แสดงแบบเพิ่มเติมแยกรายการ:', supplementAmount);
                    }
                } else if (isPND1NoPayment) {
                    // ถ้า ภ.ง.ด.1 ไม่มียอดชำระ ให้แสดงข้อความพิเศษ
                    // แทนที่ pattern เก่าที่มี "เดือน"
                    body = body.replace(/- ภ\.ง\.ด\. เดือน [^\n]+: จำนวน [^\n]+ บาท/g, 
                        `- ภ.ง.ด.1 : ไม่มียอดชำระ`);
                    // แทนที่ pattern ที่มี xxxxx
                    body = body.replace(/- ภ\.ง\.ด\. เดือน [^\n]+: จำนวน xxxxx บาท/g, 
                        `- ภ.ง.ด.1 : ไม่มียอดชำระ`);
                    // แทนที่ pattern ใหม่ (ไม่มี "เดือน")

                    if (body.includes('กรุณาชำระภายในวันที่')) {

        function loadPattern() {
            // เก็บค่า template ที่ผู้ใช้เลือกไว้ก่อน (ป้องกันไม่ให้ถูกเปลี่ยนอัตโนมัติ)
            const templateSelect = document.getElementById('emailTemplate');
            const currentTemplate = templateSelect ? templateSelect.value : '';
            
            const patternName = document.getElementById('emailPattern').value;
            if (!patternName) {
                // ถ้าไม่มี Pattern ให้รีเซ็ตข้อมูล
                window.currentPatternName = '';
                resetPatternData();
                return;
            }
            
            // ตรวจสอบว่า Pattern เปลี่ยนหรือไม่
            if (patternName !== window.currentPatternName) {
                console.log('🔄 Pattern เปลี่ยน (load):', window.currentPatternName, '→', patternName);
                
                // รีเซ็ตข้อมูลทั้งหมด
                resetPatternData();
            }
            
            // อัปเดตค่า Pattern ปัจจุบัน
            window.currentPatternName = patternName;
            
            fetch(`/api/email/pattern/${patternName}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.pattern) {
                        const pattern = data.pattern;
                        
                        // เติมข้อมูล default จาก pattern
                        if (pattern.default_to && pattern.default_to.length > 0) {
                            document.getElementById('toEmails').value = pattern.default_to.join('\n');
                        }
                        if (pattern.default_cc && pattern.default_cc.length > 0) {
                            document.getElementById('ccEmails').value = pattern.default_cc.join('\n');
                        }
                        
                        // เติม LINE User ID จาก pattern
                        if (pattern.line_user_id) {

        // ฟังก์ชันสำหรับ format Tax ID อัตโนมัติ
        function formatTaxId(input) {
            // ลบตัวอักษรที่ไม่ใช่ตัวเลขออก
            let value = input.value.replace(/\D/g, '');
            
            // จำกัดไม่เกิน 13 หลัก
            if (value.length > 13) {
                value = value.substring(0, 13);
            }
            
            // จัดรูปแบบ X-XXXX-XXXXX-XX-X
            let formatted = '';
            if (value.length > 0) {
                formatted = value[0]; // หลักที่ 1
                if (value.length > 1) {
                    formatted += '-' + value.substring(1, 5); // หลักที่ 2-5
                }
                if (value.length > 5) {
                    formatted += '-' + value.substring(5, 10); // หลักที่ 6-10
                }
                if (value.length > 10) {
                    formatted += '-' + value.substring(10, 12); // หลักที่ 11-12
                }
                if (value.length > 12) {
                    formatted += '-' + value.substring(12, 13); // หลักที่ 13
                }
            }
            
            input.value = formatted;
            
            // แสดงสถานะ validation
            const parent = input.parentElement;
            let statusEl = parent.querySelector('.tax-id-status');
            if (!statusEl) {
                statusEl = document.createElement('small');
                statusEl.className = 'tax-id-status';
                statusEl.style.display = 'block';
                statusEl.style.marginTop = '5px';
                statusEl.style.fontSize = '12px';
                parent.appendChild(statusEl);
            }
            
            if (value.length === 0) {
                statusEl.textContent = '';
            } else if (value.length < 13) {
                statusEl.style.color = '#f87171';
                statusEl.textContent = `⚠️ กรอกเลข ${value.length} หลัก (ต้องการอีก ${13 - value.length} หลัก)`;
            } else if (value.length === 13) {
                statusEl.style.color = '#10b981';
                statusEl.textContent = `✅ ครบ 13 หลัก: ${formatted}`;
            }
        }

        // ฟังก์ชันตรวจสอบความถูกต้องของข้อมูล
        function validateOCRWithPattern() {
            // หา OCR result ล่าสุด
            let latestOCR = null;
            for (let i = uploadedTaxFilingFiles.length - 1; i >= 0; i--) {
                const file = uploadedTaxFilingFiles[i];
                if (file.ocr_result && file.ocr_result.success) {
                    latestOCR = file.ocr_result;
                    break;
                }
            }
            
            if (!latestOCR) {
                console.log('ℹ️ ไม่มีข้อมูล OCR สำหรับตรวจสอบ');
                closeValidationBanner();
                return;
            }
            
            // ดึง pattern ที่เลือก
            const patternInput = document.getElementById('emailPattern');
            const selectedPatternName = patternInput ? patternInput.value : '';
            
            if (!selectedPatternName) {
                console.log('ℹ️ ยังไม่ได้เลือก Pattern');
                closeValidationBanner();
                return;
            }
            
            // หา pattern object จาก allPatterns
            const selectedPattern = allPatterns.find(p => p.pattern_name === selectedPatternName);
            
            if (!selectedPattern) {
                console.log('⚠️ ไม่พบ Pattern ที่เลือก:', selectedPatternName);
                closeValidationBanner();
                return;
            }
            
            // เปรียบเทียบข้อมูล
            const ocrTaxId = latestOCR.tax_id || '';
            const ocrCompanyName = latestOCR.company_name || '';
            const patternTaxId = selectedPattern.tax_id || '';
            const patternCompanyName = selectedPattern.company_name || '';
            
            // Normalize Tax ID
            const normalizeId = (id) => id.replace(/[\s\-]/g, '');
            const ocrTaxIdNorm = normalizeId(ocrTaxId);
            const patternTaxIdNorm = normalizeId(patternTaxId);
            
            // ตรวจสอบความตรงกัน
            const taxIdMatch = ocrTaxIdNorm && patternTaxIdNorm && ocrTaxIdNorm === patternTaxIdNorm;
            const companyMatch = calculateSimilarity(ocrCompanyName, patternCompanyName) > 0.7;
            
            console.log('🔍 [Validation]');
            console.log('  OCR Tax ID:', ocrTaxId, '(normalized:', ocrTaxIdNorm + ')');
            console.log('  Pattern Tax ID:', patternTaxId, '(normalized:', patternTaxIdNorm + ')');
            console.log('  OCR Company:', ocrCompanyName);
            console.log('  Pattern Company:', patternCompanyName);
            console.log('  Tax ID Match:', taxIdMatch);
            console.log('  Company Match:', companyMatch);
            
            // แสดงผลลัพธ์
            if (taxIdMatch && companyMatch) {
                showValidationSuccess(ocrCompanyName, ocrTaxId, patternCompanyName, patternTaxId);
            } else if (!taxIdMatch || !companyMatch) {
                showValidationWarning(ocrCompanyName, ocrTaxId, patternCompanyName, patternTaxId, taxIdMatch, companyMatch);
            }
        }
        
        // คำนวณความคล้ายกันของข้อความ (Similarity Score)
        function calculateSimilarity(str1, str2) {
            if (!str1 || !str2) return 0;
            
            const s1 = str1.toLowerCase().replace(/\s+/g, '');
            const s2 = str2.toLowerCase().replace(/\s+/g, '');
            
            // ถ้าเหมือนกันเป๊ะ
            if (s1 === s2) return 1.0;
            
            // ตรวจสอบว่ามีคำสำคัญตรงกันหรือไม่
            const words1 = str1.split(/\s+/);
            const words2 = str2.split(/\s+/);
            
            let matchCount = 0;
            for (const word of words1) {
                if (words2.some(w => w.includes(word) || word.includes(w))) {
                    matchCount++;
                }
            }
            
            return matchCount / Math.max(words1.length, words2.length);
        }

        // ฟังก์ชันนำเข้าข้อมูล Pattern จาก Excel
        function importPatternsFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // ตรวจสอบว่าเป็นไฟล์ Excel
            if (!file.name.match(/\.(xlsx|xls)$/i)) {
                alert('❌ กรุณาเลือกไฟล์ Excel (.xlsx หรือ .xls)');
                event.target.value = '';
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            // แสดง loading
            const container = document.getElementById('patternsList');
            if (container) {
                container.innerHTML = '<div class="log-entry log-info">⏳ กำลังนำเข้าข้อมูลจาก Excel...</div>';
            }
            
            fetch('/api/email/pattern/import', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(`✅ นำเข้าข้อมูลสำเร็จ: ${data.imported_count} รายการ\n${data.errors && data.errors.length > 0 ? `⚠️ มีข้อผิดพลาด ${data.errors.length} รายการ:\n${data.errors.join('\n')}` : ''}`);
                    loadPatternsList(); // โหลดรายการใหม่
                } else {
                    alert('❌ ' + (data.message || 'เกิดข้อผิดพลาดในการนำเข้าข้อมูล'));
                    if (container) {
                        container.innerHTML = '<div class="log-entry log-error">เกิดข้อผิดพลาดในการนำเข้าข้อมูล</div>';
                    }
                }
            })
            .catch(error => {
                console.error('Error importing patterns:', error);
                alert('❌ เกิดข้อผิดพลาด: ' + error);
                if (container) {
                    container.innerHTML = '<div class="log-entry log-error">เกิดข้อผิดพลาดในการนำเข้าข้อมูล</div>';
                }
            })
            .finally(() => {
                // Reset input
                event.target.value = '';
            });
        }

        function savePattern(event) {
            event.preventDefault();
            
            const editName = document.getElementById('patternEditName').value;
            const isEdit = editName !== '';
            
            const patternData = {
                pattern_name: document.getElementById('patternName').value,
                description: document.getElementById('patternDescription').value,
                company_name: document.getElementById('patternCompanyName').value,
                tax_id: document.getElementById('patternTaxId').value || undefined,
                line_user_id: document.getElementById('patternLineUserId').value || undefined,
                default_to: document.getElementById('patternDefaultTo').value.split('\n').map(e => e.trim()).filter(e => e),
                default_cc: document.getElementById('patternDefaultCc').value.split('\n').map(e => e.trim()).filter(e => e),
                default_bcc: document.getElementById('patternDefaultBcc').value.split('\n').map(e => e.trim()).filter(e => e)
            };
            
            const url = isEdit ? `/api/email/pattern/${editName}` : '/api/email/pattern';
            const method = isEdit ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(patternData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('✅ ' + data.message);
                    hideCreatePatternForm();
                    loadPatterns();
                    loadPatternsList();
                } else {
                    alert('❌ ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('❌ เกิดข้อผิดพลาด: ' + error);
            });
        }
        
        function createPattern(event) {
            // Redirect to savePattern
            savePattern(event);
        }

            const editName = document.getElementById('signatureEditName').value;
            const isEdit = editName !== '';
            
            const signatureData = {
                signature_name: document.getElementById('signatureName').value,
                description: document.getElementById('signatureDescription').value,
                sender_name: document.getElementById('senderName').value,
                sender_title: document.getElementById('senderTitle').value,
                sender_email: document.getElementById('senderEmail').value,
                sender_phone: document.getElementById('senderPhone').value,
                sender_website: document.getElementById('senderWebsite').value,
                company_name: document.getElementById('companyName').value,
                company_address: document.getElementById('companyAddress').value,
                signature_html: document.getElementById('signatureHtml').value || undefined,
                signature_block: document.getElementById('signatureBlock').value || undefined,
                logo_path: document.getElementById('signatureLogoPath').value || undefined
            };
            
            const url = isEdit ? `/api/email/signature/${editName}` : '/api/email/signature';
            const method = isEdit ? 'PUT' : 'POST';
            
            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(signatureData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('✅ ' + data.message);
                    hideCreateSignatureForm();
                    loadSignatures();
                    loadSignaturesList();
                } else {
                    alert('❌ ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('❌ เกิดข้อผิดพลาด: ' + error);
            });
        }

        // Email Preview Functions
        let previewData = null; // เก็บข้อมูลสำหรับ preview
        
        function previewEmail() {
            // ✅ ตรวจสอบว่าเลือก Signature หรือยัง
            const signatureSelect = document.getElementById('emailSignature');
            if (!signatureSelect || !signatureSelect.value || signatureSelect.value === '') {
                alert('⚠️ กรุณาเลือกลายเซ็นต์ (Signature) ก่อนดูตัวอย่างอีเมลล์');
                signatureSelect.focus();
                return; // หยุดการดูตัวอย่าง
            }
            
            // เก็บข้อมูลจากฟอร์ม
            const toEmails = document.getElementById('toEmails').value.split('\n').map(e => e.trim()).filter(e => e);
            const ccEmails = document.getElementById('ccEmails').value.split('\n').map(e => e.trim()).filter(e => e);
            const subject = document.getElementById('emailSubject').value;
            const body = document.getElementById('emailBody').value;
            const signatureName = signatureSelect.value;
            
            // เก็บข้อมูล LINE
            const lineEnabled = document.getElementById('lineEnabled') ? document.getElementById('lineEnabled').checked : false;
            const lineUserId = lineEnabled && document.getElementById('lineUserId') ? document.getElementById('lineUserId').value.trim() : '';
            const lineMessage = lineEnabled && document.getElementById('lineMessage') ? document.getElementById('lineMessage').value.trim() : '';
            
            // เตรียมข้อมูลสำหรับ preview
            previewData = {
                to_emails: toEmails,
                cc_emails: ccEmails,
                subject: subject,
                body: body,
                signature_name: signatureName || undefined,
                line_enabled: lineEnabled,
                line_user_id: lineUserId,
                line_message: lineMessage,
                attachments: getAllAttachments().map(f => ({
                    filename: f.filename,
                    temp_path: f.temp_path
                }))
            };
            
            // เรียก API เพื่อดึงข้อมูลลายเซ็นต์และสร้าง preview
            fetch('/api/email/preview', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(previewData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // แสดงข้อมูลใน modal
                    document.getElementById('previewFrom').textContent = data.from_email || '-';
                    document.getElementById('previewTo').textContent = data.to_emails && data.to_emails.length > 0 ? data.to_emails.join(', ') : '-';
                    document.getElementById('previewCC').textContent = data.cc_emails && data.cc_emails.length > 0 ? data.cc_emails.join(', ') : 'ไม่มี';
                    document.getElementById('previewSubject').textContent = data.subject || '-';
                    document.getElementById('previewAttachments').textContent = data.attachments && data.attachments.length > 0 ? data.attachments.map(a => a.filename).join(', ') : 'ไม่มี';
                    document.getElementById('previewSignature').textContent = data.signature_name || 'ไม่ใช้ลายเซ็นต์';
                    
                    // แสดงเนื้อหาอีเมลล์ (HTML)
                    const previewContent = document.getElementById('previewContent');
                    if (data.body_html) {
                        previewContent.innerHTML = data.body_html;
                    } else {
                        // แสดงเป็น text ถ้าไม่มี HTML
                        previewContent.innerHTML = '<pre style="white-space: pre-wrap; font-family: inherit;">' + (data.body || '').replace(/\n/g, '<br>') + '</pre>';
                    }
                    
                    // แสดง modal
                    document.getElementById('emailPreviewModal').style.display = 'block';
                } else {
                    alert('❌ ' + (data.message || 'ไม่สามารถสร้าง preview ได้'));
                }
            })
            .catch(error => {
                console.error('Error previewing email:', error);
                alert('❌ เกิดข้อผิดพลาดในการสร้าง preview: ' + error);
            });
        }
        
        function closeEmailPreview() {
            // ปิด modal โดยไม่ส่งอีเมลล์
            document.getElementById('emailPreviewModal').style.display = 'none';
            previewData = null;
            console.log('✅ ปิด preview modal โดยไม่ส่งอีเมลล์');
        }
        
        function sendEmailFromPreview() {
            // ส่งอีเมลล์โดยใช้ข้อมูลจาก preview
            if (!previewData) {
                alert('❌ ไม่มีข้อมูลสำหรับส่งอีเมลล์');
                console.error('previewData is null or undefined');
                return;
            }
            
            // เก็บ previewData ไว้ก่อนปิด modal (เพราะ closeEmailPreview จะลบ previewData)
            const dataToSend = JSON.parse(JSON.stringify(previewData)); // Deep copy
            
            // ปิด modal
            closeEmailPreview();
            
            // ส่งอีเมลล์โดยตรง
            sendEmailDirectly(dataToSend);
        }
        
        function sendEmailDirectly(data) {
            // ตรวจสอบว่า data มีค่าหรือไม่
            if (!data) {
                alert('❌ ไม่มีข้อมูลสำหรับส่งอีเมลล์');
                console.error('sendEmailDirectly: data is null or undefined');
                return;
            }
            
            const patternName = document.getElementById('emailPattern') ? document.getElementById('emailPattern').value : '';
            
            // เตรียม attachment data (ตรวจสอบว่ามี attachments หรือไม่)
            const attachments = (data.attachments && Array.isArray(data.attachments) && data.attachments.length > 0)
                ? data.attachments.map(f => ({
                    temp_path: f.temp_path || f.tempPath,
                    original_filename: f.filename || f.original_filename,
                    filename: f.filename || f.original_filename
                }))
                : [];
            
            if (patternName) {
                // ส่งด้วย pattern
                fetch('/api/email/send/pattern', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        pattern_name: patternName,
                        data: {},
                        to_emails: data.to_emails.length > 0 ? data.to_emails : undefined,
                        cc_emails: data.cc_emails,
                        attachments: attachments.length > 0 ? attachments : undefined,
                        signature_name: data.signature_name,
                        zip_attachments: document.getElementById('zipAttachments') ? document.getElementById('zipAttachments').checked : false
                    })
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        alert('✅ ' + result.message);
                        resetEmailForm();
                    } else {
                        alert('❌ ' + result.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('❌ เกิดข้อผิดพลาด: ' + error);
                });
            } else {
                // ส่งปกติ
                fetch('/api/email/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        to_emails: data.to_emails.length > 0 ? data.to_emails : undefined,
                        cc_emails: data.cc_emails,
                        subject: data.subject,
                        body: data.body,
                        attachments: attachments.length > 0 ? attachments : undefined,
                        signature_name: data.signature_name,
                        zip_attachments: document.getElementById('zipAttachments') ? document.getElementById('zipAttachments').checked : false
                    })
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        alert('✅ ' + result.message);
                        // ส่ง LINE ถ้าเปิดใช้งาน - ใช้ข้อมูลจาก data แทนการอ่านจาก DOM
                        const lineEnabled = data.line_enabled || false;
                        const lineUserId = data.line_user_id || '';
                        const lineMessage = data.line_message || '';
                        if (lineEnabled && lineUserId) {
                            const messageToSend = lineMessage || `📧 อีเมลล์: ${data.subject}\n\n${data.body ? data.body.substring(0, 1000) + (data.body.length > 1000 ? '...' : '') : ''}`;
                            fetch('/api/line/send', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ user_id: lineUserId, message: messageToSend })
                            })
                            .then(response => {
                                if (!response.ok) {
                                    return response.json().then(data => {
                                        throw new Error(data.message || `HTTP ${response.status}: ${response.statusText}`);
                                    });
                                }
                                return response.json();
                            })
                            .then(lineResult => {
                                if (lineResult.success) {
                                    console.log('✅ ส่งข้อความ LINE สำเร็จ');
                                } else {
                                    const errorMsg = lineResult.message || 'ไม่ทราบสาเหตุ';
                                    console.warn('⚠️ ส่งข้อความ LINE ไม่สำเร็จ: ' + errorMsg);
                                    alert('⚠️ ส่งข้อความ LINE ไม่สำเร็จ: ' + errorMsg);
                                }
                            })
                            .catch(error => {
                                console.error('❌ เกิดข้อผิดพลาดในการส่ง LINE:', error);
                                alert('❌ เกิดข้อผิดพลาดในการส่งข้อความ LINE: ' + error.message);
                            });
                        }
                        resetEmailForm();
                    } else {
                        alert('❌ ' + result.message);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('❌ เกิดข้อผิดพลาด: ' + error);
                });
            }
        }

        // ฟังก์ชันแสดง Custom Alert Modal แทน alert()
        function showCustomAlert(message, type = 'warning') {
            // type: 'info', 'success', 'error', 'warning'
            const modal = document.getElementById('customAlertModal');
            const iconEl = document.getElementById('customAlertIcon');
            const titleEl = document.getElementById('customAlertTitle');
            const messageEl = document.getElementById('customAlertMessage');
            const okBtn = document.getElementById('customAlertOkBtn');
            const contentEl = document.getElementById('customAlertContent');
            
            if (!modal) {
                // Fallback to native alert if modal doesn't exist
                alert(message);
                return;
            }
            
            // กำหนดสีและไอคอนตาม type
            let icon = '⚠️';
            let title = 'แจ้งเตือน';
            let bgGradient = 'linear-gradient(135deg, #1e293b 0%, #334155 100%)';
            let titleColor = '#60a5fa';
            let borderColor = '#475569';
            let btnGradient = 'linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)';
            
            if (type === 'success') {
                icon = '✅';
                title = 'สำเร็จ';
                bgGradient = 'linear-gradient(135deg, #059669 0%, #047857 100%)';
                titleColor = '#10b981';
                borderColor = '#10b981';
                btnGradient = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
            } else if (type === 'error') {
                icon = '❌';
                title = 'เกิดข้อผิดพลาด';
                bgGradient = 'linear-gradient(135deg, #dc2626 0%, #b91c1c 100%)';
                titleColor = '#fca5a5';
                borderColor = '#dc2626';
                btnGradient = 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)';
            } else if (type === 'info') {
                icon = 'ℹ️';
                title = 'ข้อมูล';
                bgGradient = 'linear-gradient(135deg, #1e293b 0%, #334155 100%)';
                titleColor = '#60a5fa';
                borderColor = '#475569';
                btnGradient = 'linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)';
            } else if (type === 'warning') {
                icon = '⚠️';
                title = 'แจ้งเตือน';
                bgGradient = 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)';
                titleColor = '#fbbf24';
                borderColor = '#f59e0b';
                btnGradient = 'linear-gradient(135deg, #f59e0b 0%, #d97706 100%)';
            }
            
            // อัปเดตเนื้อหา
            iconEl.textContent = icon;
            titleEl.textContent = title;
            titleEl.style.color = titleColor;
            messageEl.textContent = message;
            contentEl.style.background = bgGradient;
            contentEl.style.borderColor = borderColor;
            okBtn.style.background = btnGradient;
            
            // แสดง modal
            modal.style.display = 'flex';
            
            // Focus ที่ปุ่ม OK เพื่อให้กด Enter ได้
            setTimeout(() => {
                okBtn.focus();
            }, 100);
            
            // เพิ่ม event listener สำหรับปุ่ม Enter
            okBtn.onkeydown = function(e) {
                if (e.key === 'Enter') {
                    closeCustomAlert();
                }
            };
        }
        
        // ฟังก์ชันปิด Custom Alert Modal
        function closeCustomAlert() {
            const modal = document.getElementById('customAlertModal');
            if (modal) {
                modal.style.display = 'none';
            }
        }

        // LINE Functions
        function toggleLineSettings() {
            const lineEnabled = document.getElementById('lineEnabled').checked;
            const lineSettings = document.getElementById('lineSettings');
            if (lineEnabled) {
                lineSettings.style.display = 'block';
            } else {
                lineSettings.style.display = 'none';
            }
            
            // ตรวจสอบ checkbox สร้าง PDF
            const generatePDF = document.getElementById('generateSummaryPDF');
            if (generatePDF) {
                generatePDF.onchange = function() {
                    const summarySettings = document.getElementById('summaryPDFSettings');
                    if (summarySettings) {
                        summarySettings.style.display = this.checked ? 'block' : 'none';
                    }
                };
            }
        }
        
        // โหลดการตั้งค่า LINE เมื่อโหลดหน้า
        function loadLineSettings() {
            fetch('/api/line/settings')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        if (data.enabled !== undefined) {
                            document.getElementById('lineEnabled').checked = data.enabled;
                            toggleLineSettings();
                        }
                        if (data.default_user_id) {
                            document.getElementById('lineUserId').value = data.default_user_id;
                        }
                    }
                })
                .catch(error => {
                    console.error('Error loading LINE settings:', error);
                });
        }
        
        // เรียกใช้เมื่อโหลดหน้า
        if (document.getElementById('lineEnabled')) {
            loadLineSettings();
        }
    </script>
